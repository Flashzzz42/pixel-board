      const fs=Math.max(5,Math.round(cell*0.5));
      octx.font='bold '+fs+'px sans-serif';
      octx.textAlign='center';
      octx.textBaseline='middle';

          octx.fillText(matchedPalette[idx].code,cx,cy);
        }
      }

    for(const r of rulers){
      drawDim(octx,r.a,r.b, (r.a.gx-gx0)*cell,(r.a.gy-gy0)*cell, (r.b.gx-gx0)*cell,(r.b.gy-gy0)*cell, r.off, cell, 1);
    }
    // 色号清单：'append' 拼接到主图下方（单张图）；'sep' 主图下载后另下载单独清单
    if(legendMode==='append'){
      const strip=buildLegendStrip(W,{x0:gx0,y0:gy0,x1:gx1,y1:gy1});

        cctx.fillStyle='#fff'; cctx.fillRect(0,H,W,LG+lh);
        cctx.fillStyle='#000'; cctx.fillRect(0,H,W,2);
        cctx.imageSmoothingEnabled=true;   // 清单按低分辨率生成后放大，平滑插值避免锯齿
        cctx.drawImage(strip.canvas,0,H+LG,W,lh);
        cctx.imageSmoothingEnabled=false;
        out=combined;
      }else{
        alert('导出范围内没有已标注的色号');
      }
    }
    const a=document.createElement('a');
    a.href=out.toDataURL('image/png');
    a.download='pixel-board-'+rw+'x'+rh+(big?'-crop':'')+'.png';
    a.click();
    if(legendMode==='sep'){
      const strip=buildLegendStrip(W,{x0:gx0,y0:gy0,x1:gx1,y1:gy1});
      if(strip) downloadLegendStrip(strip,gx0,gy0,gx1,gy1);
      else alert('导出范围内没有已标注的色号');
    }
  }
  function exportPNG(){
    exportRegion(0,0,GRID_W-1,GRID_H-1, false);
  }
  // 全画幅导出格子尺寸：分辨率随画幅增大而增大（格子不小于 MIN_CELL），不超过每边上限
  function fullExportCell(){
    const gs=gridSize();
    const viewCell=gs.w/GRID_W;
    const cap=MAX_EXPORT/Math.max(GRID_W,GRID_H);
    return Math.min(Math.max(viewCell, MIN_CELL), cap);
  }
  // 主图导出宽度（整体导出时画布视图宽度；色号清单独立导出时按此宽度排列网格）
  function mainExportWidth(){
    return Math.round(GRID_W*fullExportCell());
  }
  // 构建色号清单条：统计区域内实际用到的色号，按主图宽度横向排成多列网格；
  // 分辨率受限（LEGEND_MAX_W），拼接时按 visualHeight 放大回视觉大小；
  // 返回 {canvas,height,visualHeight}；无色卡或区域内无编码返回 null
  function buildLegendStrip(width, rect){
    if(!matchedPalette || !cellCodeIdx) return null;
    const x0=rect?rect.x0:0, y0=rect?rect.y0:0, x1=rect?rect.x1:GRID_W-1, y1=rect?rect.y1:GRID_H-1;
    const counts=new Map();
    for(let y=y0;y<=y1;y++){
      for(let x=x0;x<=x1;x++){
        const idx=cellCodeIdx[y*GRID_W+x];
        if(idx!==NO_CODE) counts.set(idx,(counts.get(idx)||0)+1);
      }
    }
    if(counts.size===0) return null;
    const idxs=[...counts.keys()].sort((a,b)=>a-b);
    // 清单相对整幅是固定比例，无需整幅同等的清晰度：画布超过 LEGEND_MAX_W 时按比例降低分辨率，
    // 拼接/单独导出时再放大回视觉大小
    const scale=Math.max(1,Math.ceil(width/LEGEND_MAX_W));
    const w=Math.round(width/scale);
    const pad=Math.round(20/scale), hg=Math.round(18/scale);
    const sz=Math.max(Math.round(16/scale),Math.round(width*LEGEND_RATIO/scale));   // 色块边长：占导出图片宽度的 3%（与格子大小无关）
    const vg=Math.max(Math.round(6/scale),Math.round(sz*16/56));   // 行间隔随色块放大（基准：56→16）
    const fs=Math.max(Math.round(5/scale),Math.round(sz*0.5));   // 标注字号：随色块边长缩放
    const fsCount=Math.max(Math.round(4/scale),Math.round(fs/2));   // 用量字号 = 编号字号的一半
    // 文字区按字号拉开：编号不与色块重叠，编号与用量之间留间隔
    const half=Math.max(Math.round(3/scale),Math.round(fs*0.4));
    const halfC=Math.max(Math.round(2/scale),Math.round(fsCount*0.4));
    const gapBlock=Math.round(6/scale);   // 色块与编号之间的间隔
    const gapLine=Math.round(6/scale);    // 编号与用量之间的间隔
    const codeY=sz+half+gapBlock;         // 编号中心（相对色块顶）
    const countY=codeY+half+halfC+gapLine;   // 用量中心
    const cellH=countY+halfC+Math.round(8/scale);   // 行高
    const cols=Math.min(15,Math.max(1,Math.floor((w-2*pad+hg)/(sz+hg))));
    const gridW=cols*(sz+hg)-hg;
    const x0off=Math.round((w-gridW)/2);   // 清单网格整体水平居中，左右边距相等
    const rows=Math.ceil(idxs.length/cols);
    const c=document.createElement('canvas');
    c.width=w;
    c.height=Math.round(2*pad+rows*cellH+(rows-1)*vg);
    const octx=c.getContext('2d');
    octx.imageSmoothingEnabled=false;
    octx.fillStyle='#fff'; octx.fillRect(0,0,c.width,c.height);
    for(let k=0;k<idxs.length;k++){
      const i=idxs[k], pal=matchedPalette[i];
      const col=k%cols, row=Math.floor(k/cols);
      // 行首统一从 x0off 起排：不足 15 个的最后一行与其他行左对齐
      const x=x0off+col*(sz+hg), y=pad+row*(cellH+vg);
      octx.fillStyle='rgb('+pal.r+','+pal.g+','+pal.b+')';
      octx.fillRect(x,y,sz,sz);
      octx.strokeStyle='#000'; octx.lineWidth=1;
      octx.strokeRect(x-0.5,y-0.5,sz+1,sz+1);
      octx.textAlign='center'; octx.textBaseline='middle'; octx.fillStyle='#000';
      octx.font='bold '+fs+'px sans-serif';
      octx.fillText(pal.code, x+sz/2, y+codeY);
      octx.font=fsCount+'px sans-serif';
      octx.fillText('×'+counts.get(i), x+sz/2, y+countY);
    }
    return {canvas:c, height:c.height, visualHeight:Math.round(c.height*scale)};
  }
  function downloadLegendStrip(strip, x0,y0,x1,y1){
    const rw=x1-x0+1, rh=y1-y0+1;
    const a=document.createElement('a');
    a.href=strip.canvas.toDataURL('image/png');
    a.download='pixel-board-'+rw+'x'+rh+'-legend.png';
    a.click();
  }
  // 单独导出色号清单（整幅，宽度与主图一致）
  function exportLegend(rect){
    const strip=buildLegendStrip(mainExportWidth(), rect);
    if(!strip){
      alert(!matchedPalette||!cellCodeIdx ? '请先匹配色卡后，再导出色号清单' : '导出范围内没有已标注的色号');
      return;
    }
    const x0=rect?rect.x0:0, y0=rect?rect.y0:0, x1=rect?rect.x1:GRID_W-1, y1=rect?rect.y1:GRID_H-1;
    downloadLegendStrip(strip, x0,y0,x1,y1);
  }

  // ---- 导出弹窗 / 局部画幅导出 ----
  // 交互：左键单击同时生成矩形选区（蓝色半透明，同套索选区样式）与「确定导出」按钮，
  //       拖动顶点/边调整选区，按下按钮导出；Esc 取消
  const exportPopupEl=document.getElementById('exportPopup');
  const exportOkBtn=document.getElementById('exportOkBtn');
  let exportEmptyMode='white';   // 空色块导出：'white' 合成白底 / 'green' 合成绿底 / 'transparent' 保留透明
  let legendMode='off';          // 色号清单：'off' 不导出 / 'sep' 单独下载 / 'append' 拼接到主图下方
  let exportRectMode=false;
  let exportRect=null;          // {x0,y0,x1,y1} 格坐标（整数）
  let exportCorner=null;        // 第 1 个角点 {gx,gy}，等待第 2 个对角顶点
  let exportCornerCur=null;     // 角点期间当前鼠标格，用于预览
  let exportOkPos=null;         // 确定按钮位置（client 坐标）
  let exportDrag=null;          // 拖动状态
  // 全画幅导出预计尺寸：分辨率随画幅增大而增大；文件大小按约 0.5 字节/像素估算（PNG 对纯色区域压缩较好）。
  // 勾选色号清单时：拼接导出分别显示 全图 + 清单 大小；单独导出分别说明两张图片。
  function updateExportStats(){
    const el=document.getElementById('exportStats');
    if(!el) return;
    const cell=fullExportCell();
    const W=Math.round(GRID_W*cell), H=Math.round(GRID_H*cell);
    const fmt=(bytes)=>{
      if(bytes>=1024*1024) return (bytes/(1024*1024)).toFixed(1)+' MB';
      if(bytes>=1024) return Math.round(bytes/1024)+' KB';
      return bytes+' B';
    };
    const full=fmt(Math.round(W*H/2));
    const head='全画幅导出预计 '+W+' × '+H+' px · ';
    if(legendMode!=='off'){
      const strip=buildLegendStrip(mainExportWidth(), null);
      if(strip){
        const legend=fmt(Math.round(strip.canvas.width*strip.height/2));
        if(legendMode==='append') el.textContent=head+'约 '+full+' + '+legend+'（全图 + 清单）';
        else el.textContent=head+'全图约 '+full+'，清单约 '+legend;
        return;
      }
    }
    el.textContent=head+'约 '+full;
  }
  function openExportPopup(){
    closeRulerMenu();
    const lb=document.getElementById('legendBtn');
    if(lb) lb.disabled=!(matchedPalette&&cellCodeIdx);
    updateExportStats();
    exportPopupEl.style.display='flex';
  }
  function closeExportPopup(){
    exportPopupEl.style.display='none';
  }
  function showExportOkBtn(){
    exportOkBtn.style.display='block';
    const w=exportOkBtn.offsetWidth, h=exportOkBtn.offsetHeight;
    const x=exportOkPos?exportOkPos.x:0, y=exportOkPos?exportOkPos.y:0;
    exportOkBtn.style.left=Math.max(4,Math.min(x+12,window.innerWidth-4-w))+'px';
    exportOkBtn.style.top=Math.max(4,Math.min(y+12,window.innerHeight-4-h))+'px';
  }
  function hideExportOkBtn(){
    exportOkBtn.style.display='none';
  }
  document.getElementById('exportBtn').addEventListener('click',e=>{
    e.stopPropagation();
    if(exportPopupEl.style.display==='none') openExportPopup();
    else closeExportPopup();
  });
  exportPopupEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.legendExport){
        legendMode=b.dataset.legendExport;
        exportPopupEl.querySelectorAll('[data-legend-export]').forEach(x=>x.classList.toggle('active',x===b));
        updateExportStats();
        return;   // 切换色号清单选项不关闭弹层
      }
      if(b.dataset.emptyExport){
        exportEmptyMode=b.dataset.emptyExport;
        exportPopupEl.querySelectorAll('[data-empty-export]').forEach(x=>x.classList.toggle('active',x===b));
        return;   // 切换导出选项不关闭弹层
      }
      const act=b.dataset.exportAction;
      closeExportPopup();
      if(act==='full') exportPNG();
      else if(act==='region') enterExportRectMode();
      else if(act==='legend') exportLegend(null);
    });
  });
  exportOkBtn.addEventListener('click',()=>{
    if(!exportRect) return;
    exportRegion(exportRect.x0,exportRect.y0,exportRect.x1,exportRect.y1, true);
    statusEl.textContent='已导出局部区域 '+(exportRect.x1-exportRect.x0+1)+'×'+(exportRect.y1-exportRect.y0+1)+' 格';
    exitExportRect();
    render();
  });
  function enterExportRectMode(){
    if(rulerPlacing) cancelRulerPlace();
    exportRectMode=true;
    exportRect=null;
    exportCorner=null;
    exportCornerCur=null;
    exportOkPos=null;
    exportDrag=null;
    hideExportOkBtn();
    canvas.style.cursor='crosshair';
    statusEl.textContent='单击第 1 个角点，再单击对角顶点确定导出区域';
    render();
  }
  function exitExportRect(){
    exportRectMode=false;
    exportRect=null;
    exportCorner=null;
    exportCornerCur=null;
    exportOkPos=null;
    exportDrag=null;
    hideExportOkBtn();
    canvas.style.cursor='';
  }
  function cancelExportRect(){
    exitExportRect();
    render();
  }
  function evToCanvas(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)};
  }
  function clampCell(v,max){ return Math.max(0,Math.min(max,Math.round(v))); }
  function rectScreen(rc){
    const o=gridOffsets(), gs=gridSize();
    const cw=gs.w/GRID_W, ch=gs.h/GRID_H;
    return {x0:o.ox+rc.x0*cw, y0:o.oy+rc.y0*ch, x1:o.ox+(rc.x1+1)*cw, y1:o.oy+(rc.y1+1)*ch};
  }
  function exportHitTest(e){
    if(!exportRect) return null;
    const s=rectScreen(exportRect);
    const p=evToCanvas(e);
    const corners=[['tl',s.x0,s.y0],['tr',s.x1,s.y0],['br',s.x1,s.y1],['bl',s.x0,s.y1]];
    for(const c of corners){
      if(Math.hypot(p.x-c[1],p.y-c[2])<10) return {type:'corner', corner:c[0]};
    }
    if(distToSeg(p.x,p.y,s.x0,s.y0,s.x1,s.y0)<7) return {type:'n'};
    if(distToSeg(p.x,p.y,s.x0,s.y1,s.x1,s.y1)<7) return {type:'s'};
    if(distToSeg(p.x,p.y,s.x0,s.y0,s.x0,s.y1)<7) return {type:'w'};
    if(distToSeg(p.x,p.y,s.x1,s.y0,s.x1,s.y1)<7) return {type:'e'};
    if(p.x>=s.x0&&p.x<=s.x1&&p.y>=s.y0&&p.y<=s.y1) return {type:'inside'};
    return null;
  }
  function startExportDrag(e, type, corner){
    const g=evToGridF(e);
    const o=exportRect;
    exportDrag={type:type, corner:corner||null, moved:false,
                startG:{gx:g.gx, gy:g.gy}, startCX:e.clientX, startCY:e.clientY,
                orig:{x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1}};
  }
  function updateExportDrag(g){
    const d=exportDrag, o=d.orig;
    if(d.type==='inside'){
      const dx=g.gx-d.startG.gx, dy=g.gy-d.startG.gy;
      let x0=Math.round(o.x0+dx), x1=Math.round(o.x1+dx);
      let y0=Math.round(o.y0+dy), y1=Math.round(o.y1+dy);
      if(x0<0){ x1-=x0; x0=0; }
      if(x1>GRID_W-1){ x0-=x1-(GRID_W-1); x1=GRID_W-1; }
      if(y0<0){ y1-=y0; y0=0; }
      if(y1>GRID_H-1){ y0-=y1-(GRID_H-1); y1=GRID_H-1; }
      exportRect={x0:x0,y0:y0,x1:x1,y1:y1};
      return;
    }
    const gx=clampCell(g.gx,GRID_W-1), gy=clampCell(g.gy,GRID_H-1);
    let x0=o.x0,y0=o.y0,x1=o.x1,y1=o.y1;
    if(d.type==='corner'){
      if(d.corner==='tl'){ x0=Math.min(gx,x1); y0=Math.min(gy,y1); }
      else if(d.corner==='tr'){ x1=Math.max(gx,x0); y0=Math.min(gy,y1); }
      else if(d.corner==='br'){ x1=Math.max(gx,x0); y1=Math.max(gy,y0); }
      else if(d.corner==='bl'){ x0=Math.min(gx,x1); y1=Math.max(gy,y0); }
    }else if(d.type==='n'){ y0=Math.min(gy,y1); }
    else if(d.type==='s'){ y1=Math.max(gy,y0); }
    else if(d.type==='w'){ x0=Math.min(gx,x1); }
    else if(d.type==='e'){ x1=Math.max(gx,x0); }
    exportRect={x0:x0,y0:y0,x1:x1,y1:y1};
  }

  // ---- 清空 ----
  function doClearCanvas(msg){
    const before=snapshot();
    fillWhite();
    importedImg=null;
    lastImported=null;
    origImg=null;
    importedImgDataURL=null;
    restoreImgToken++;   // 丢弃在途的原图加载，清空后不再按原图重渲染
    clearRulers();
    matchedPalette=null;
    matchedCard=null;
    cellCodeIdx.fill(NO_CODE);
    showCodes=false;
    updateCodeBtn();
    // 即使画面本就空白，清空仍可能删除原图信息，此时也要可撤销（上下文比较见 sameContext）
    if(!samePixels(before.pixels,pixels)||!sameContext(before.ctx,contextState())) pushUndo(before);
    render();
    statusEl.textContent=msg||'已清空';
  }
  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(!confirm('是否清空画布？')) return;
    doClearCanvas();
  });

  // ---- 清除作画痕迹：按原图信息在当前尺寸下重新渲染，覆盖手动画的痕迹 ----
  // 看似“清除”，实为加法：用导入原图（当前尺寸 + 色卡匹配状态）重画覆盖；
  // 视为重新渲染而非手动绘制，因此会重置 userEdited、解除尺寸锁定。
  // 没有导入原图时，默认等同于「清空画布」（doClearCanvas）。
  function clearTraces(){
    const before=snapshot();
    let handled=false;
    if(importedImg&&(importedImg.naturalWidth||importedImg.width)){
      const s=rasterizeImage(importedImg,GRID_W,GRID_H);
      if(s){ pixels.set(s); handled=true; }
    }else if(origImg&&origImg.px){
      const s=rasterizeRaw(origImg.px,origImg.w,origImg.h,GRID_W,GRID_H);
      if(s){ pixels.set(s); handled=true; }
    }else if(lastImported&&lastImported.data&&lastImported.data.pixels){
      // 老草稿无原图像素：从保存的网格快照重新栅格化（就地写入 pixels）
      rasterizeSnapshotToGrid(lastImported.data.pixels,lastImported.w,lastImported.h);
      handled=true;
    }
    if(!handled){
      doClearCanvas('没有导入的原图，已清空画布');
      return;
    }
    cellCodeIdx.fill(NO_CODE);
    // 处于色卡匹配模式时，把重渲染的原图颜色吸附到当前匹配色卡（含编号）
    if(matchedPalette&&matchedCard){
      for(let y=0;y<GRID_H;y++){
        for(let x=0;x<GRID_W;x++){
          const i=(y*GRID_W+x)*4;
          if(pixels[i+3]===0) continue;   // 原图该格无色，保持空白
          setCell(x,y,pixels[i],pixels[i+1],pixels[i+2]);
        }
      }
    }
    // 视为重新渲染而非手动绘制：解除尺寸锁定
    userEdited=false;
    updateSizeLock();
    // 解除尺寸锁定也属于上下文变化，像素没变时同样可撤销（见 sameContext）
    if(!samePixels(before.pixels,pixels)||!sameContext(before.ctx,contextState())) pushUndo(before);
    render();
    statusEl.textContent='已清除作画痕迹，按原图重新渲染'+(matchedCard?'（匹配 '+matchedCard.name+'）':'');
  }
  document.getElementById('clearTracesBtn').addEventListener('click',clearTraces);

  // ---- 显示倍率（1×=完整视图，选择后以窗口中心为焦点）----
  const zoomSel=document.getElementById('zoom');
  function syncZoomSelect(){
    const opts=[].slice.call(zoomSel.options).map(o=>parseFloat(o.value));
    if(opts.indexOf(mag)!==-1){ zoomSel.value=String(mag); return; }
    let opt=zoomSel.querySelector('option[data-custom]');
    if(!opt){
      opt=document.createElement('option');
      opt.dataset.custom='1';
      zoomSel.insertBefore(opt,zoomSel.firstChild);
    }
    opt.value=String(Math.round(mag*100)/100);
    opt.textContent=(Math.round(mag*100)/100)+'×';
    zoomSel.value=opt.value;
  }
  zoomSel.addEventListener('change',e=>{
    mag=parseFloat(e.target.value)||1;
    offX=offY=0;
    render();
  });

  // ---- 快捷键：撤销 / 重做 ----
  document.addEventListener('keydown',e=>{
    if(draftLibOpen) return;   // 草稿库打开时画布功能关闭
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='z'){
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
    }else if(mod&&e.key.toLowerCase()==='y'){
      e.preventDefault(); redo();
    }
  });

  // ---- 像素空间尺寸设置 ----
  const gridWInput=document.getElementById('gridW');
  const gridHInput=document.getElementById('gridH');
  const squareSlider=document.getElementById('squareSlider');
  const squareSliderVal=document.getElementById('squareSliderVal');
  function isCanvasBlank(){
    for(let i=3;i<pixels.length;i+=4) if(pixels[i]!==0) return false;
    return true;
  }
  function sizeLocked(){ return userEdited && !isCanvasBlank(); }
  function updateSizeLock(){
    const locked=sizeLocked();
    gridWInput.disabled=locked;
    gridHInput.disabled=locked;
    squareSlider.disabled=locked;
    document.querySelectorAll('.size-preset').forEach(b=>b.disabled=locked);
    const btn=document.getElementById('applySizeBtn');
    if(btn) btn.disabled=locked;
    const hint=document.getElementById('sizeLockHint');
    if(hint) hint.style.display=locked?'block':'none';
  }
  // 手动绘制/编辑产生实际改动时调用：置锁定标记并刷新锁定状态
  function markEdited(){ userEdited=true; updateSizeLock(); }
  function resizeGridTo(w,h){
    if(sizeLocked()){
      statusEl.textContent='画板已手动修改，尺寸已锁定（撤销到空白可解除锁定）';
      return;
    }
    const ow=GRID_W, oh=GRID_H;
    const old=pixels.slice();
    GRID_W=w; GRID_H=h;
    undoStack.length=0; redoStack.length=0;
    syncUndoRedo();
    rebuildGrid();
    clearRulers();
    symX=GRID_W/2; symY=GRID_H/2;   // 尺寸变化后对称轴回到画布中央
    if(importedImg&&(importedImg.naturalWidth||importedImg.width)){
      rasterizeImageToGrid(importedImg);
      // 画布已按新尺寸重新栅格化原图，同步更新原图快照的尺寸与像素，
      // 否则 lastImported 尺寸失配会让「原图色彩」失效、匹配回退到已量化的画布像素
      lastImported={data:snapshot(),w:GRID_W,h:GRID_H};
    }else if(origImg&&origImg.px){
      // 草稿/刷新恢复场景：没有可用的 Image 元素，但有持久化的原图原始像素，
      // 直接按原图重新栅格化，避免从已量化快照缩放造成细节/尺寸丢失
      rasterizeRawToGrid();
      lastImported={data:snapshot(),w:GRID_W,h:GRID_H};
    }else if(lastImported&&lastImported.data&&lastImported.data.pixels){
      // 老草稿（无原图像素）：退回用保存的原图快照等比重栅格化到新画布，
      // 避免整幅最近邻缩放造成图片拉伸畸变
      rasterizeSnapshotToGrid(lastImported.data.pixels,lastImported.w,lastImported.h);
      lastImported={data:snapshot(),w:GRID_W,h:GRID_H};
    }else{
      for(let ny=0;ny<h;ny++){
        const sy=Math.min(oh-1,Math.floor(ny*oh/h));
        for(let nx=0;nx<w;nx++){
          const sx=Math.min(ow-1,Math.floor(nx*ow/w));
          const si=(sy*ow+sx)*4;
          const di=(ny*w+nx)*4;
          pixels[di]=old[si];pixels[di+1]=old[si+1];pixels[di+2]=old[si+2];pixels[di+3]=old[si+3];
        }
      }
    }
    render();
    scheduleAutoSave();
    updateExportStats();   // 尺寸变化后刷新导出预计尺寸
  }

  // ---- 自定义颜色：环形取色器 ----
  const wheelOverlay=document.getElementById('wheelOverlay');
  const wheelCanvas=document.getElementById('wheelCanvas');
  const wheelCtx=wheelCanvas.getContext('2d');
  const wheelPreview=document.getElementById('wheelPreview');
  const wheelHex=document.getElementById('wheelHex');
  const WC=120, R_OUT=118, R_IN=104, SQ_H=72, SIDE=144;
  let H=0, S=1, V=1, wheelMode=null, dragging=false;
  function hsvToRgb(h,s,v){
    h=((h%360)+360)%360;
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;}
    else if(h<120){r=x;g=c;}
    else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;}
    else if(h<300){r=x;b=c;}
    else{r=c;b=x;}
    return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
  }
  function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
  function hexToHsv(hex){
    const {r,g,b}=parseHex(hex);
    const rn=r/255, gn=g/255, bn=b/255;
    const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn), d=max-min;
    let h=0;
    if(d!==0){
      if(max===rn) h=((gn-bn)/d)%6;
      else if(max===gn) h=(bn-rn)/d+2;
      else h=(rn-gn)/d+4;
      h*=60; if(h<0) h+=360;
    }
    return {h, s:max===0?0:d/max, v:max};
  }
  function curHex(){ return rgbToHex(hsvToRgb(H,S,V)); }
  function drawWheel(){
    const img=wheelCtx.createImageData(240,240);
    const d=img.data;
    for(let y=0;y<240;y++){
      for(let x=0;x<240;x++){
        const dx=x-WC, dy=y-WC, r=Math.sqrt(dx*dx+dy*dy);
        const i=(y*240+x)*4;
        if(r>R_OUT){ d[i+3]=0; continue; }
        let c;
        if(r>R_IN){
          c=hsvToRgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,1,1);
        }else if(x>=WC-SQ_H&&x<=WC+SQ_H&&y>=WC-SQ_H&&y<=WC+SQ_H){
          c=hsvToRgb(H,(x-(WC-SQ_H))/SIDE,1-(y-(WC-SQ_H))/SIDE);
        }else{
          c=hsvToRgb(H,1,0.55);
        }
        d[i]=c.r;d[i+1]=c.g;d[i+2]=c.b;d[i+3]=255;
      }
    }
    wheelCtx.putImageData(img,0,0);
    const ang=H*Math.PI/180;
    wheelCtx.beginPath();wheelCtx.arc(WC+Math.cos(ang)*111,WC+Math.sin(ang)*111,6,0,Math.PI*2);
    wheelCtx.lineWidth=2;wheelCtx.strokeStyle='#fff';wheelCtx.stroke();
    wheelCtx.fillStyle='#111';wheelCtx.fill();
    wheelCtx.beginPath();wheelCtx.arc(WC-SQ_H+S*SIDE,WC-SQ_H+(1-V)*SIDE,6,0,Math.PI*2);
    wheelCtx.lineWidth=2;wheelCtx.strokeStyle='#fff';wheelCtx.stroke();
    wheelCtx.fillStyle=curHex();wheelCtx.fill();
  }
  function wheelApply(){
    setCurColor(customHex);
    wheelPreview.style.background=customHex;
    wheelHex.value=customHex.toUpperCase();
  }
  function updateFromPointer(px,py){
    if(wheelMode==='hue'){
      H=(Math.atan2(py-WC,px-WC)*180/Math.PI+360)%360;
    }else{
      S=Math.max(0,Math.min(1,(px-(WC-SQ_H))/SIDE));
      V=Math.max(0,Math.min(1,1-(py-(WC-SQ_H))/SIDE));
    }
    customHex=curHex();
    wheelApply();
    drawWheel();
  }
  function wheelPos(e){
    const rect=wheelCanvas.getBoundingClientRect();
    return {x:(e.clientX-rect.left)*240/rect.width, y:(e.clientY-rect.top)*240/rect.height};
  }
  wheelCanvas.addEventListener('pointerdown',e=>{
    const p=wheelPos(e);
    const r=Math.hypot(p.x-WC,p.y-WC);
    wheelMode=(r>=R_IN&&r<=R_OUT)?'hue':'sv';
    dragging=true;
    wheelCanvas.setPointerCapture(e.pointerId);
    updateFromPointer(p.x,p.y);
  });
  wheelCanvas.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const p=wheelPos(e);
    updateFromPointer(p.x,p.y);
  });
  const endDrag=()=>{ dragging=false; wheelMode=null; };
  wheelCanvas.addEventListener('pointerup',endDrag);
  wheelCanvas.addEventListener('pointercancel',endDrag);
  let wheelStartHex=null;
  function openWheel(){
    const hsv=hexToHsv(curColor);
    H=hsv.h; S=hsv.s; V=hsv.v;
    customHex=curColor;
    wheelStartHex=curColor;
    wheelOverlay.style.display='flex';
    wheelApply();
    drawWheel();
  }
  function closeWheel(){
    // 颜色有变化才视为选定：提交历史 + 有选区则替换 + 橡皮状态切回画笔（与原生取色器一致）
    if(customHex!==wheelStartHex) pickColor(customHex);
    wheelStartHex=null;
    wheelOverlay.style.display='none';
    dragging=false; wheelMode=null;
  }
  document.getElementById('wheelOk').addEventListener('click',closeWheel);
  wheelOverlay.addEventListener('mousedown',e=>{ if(e.target===wheelOverlay) closeWheel(); });
  wheelHex.addEventListener('change',()=>{
    const v=wheelHex.value.trim();
    if(/^#?[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(v)){
      const hex=v.startsWith('#')?v:'#'+v;
      const hsv=hexToHsv(hex);
      H=hsv.h; S=hsv.s; V=hsv.v; customHex=hex;
      wheelApply(); drawWheel();   // 只预览，由「完成」时统一提交
    }else{
      wheelHex.value=customHex.toUpperCase();
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && wheelOverlay.style.display!=='none') closeWheel();
  });

  // ---- 保存 / 恢复（Ctrl+S 保存，刷新或关闭后自动保留）----
  const SAVE_KEY='pixel_board_save_v1';
  function bytesToB64(u8){
    let bin='';
    const chunk=0x8000;
    for(let i=0;i<u8.length;i+=chunk) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk));
    return btoa(bin);
  }
  function b64ToBytes(b64){
    const bin=atob(b64);
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    return u8;
  }
  function loadState(){
    let raw=null;
    try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
    if(!raw) return false;
    let save=null;
    try{ save=JSON.parse(raw); }catch(e){ return false; }
    if(!save||!save.px) return false;
    const w=save.w||GRID_W, h=save.h||GRID_H;
    if(w!==GRID_W||h!==GRID_H){
      GRID_W=w; GRID_H=h;
      rebuildGrid();
    }
    try{
      const pxU8=b64ToBytes(save.px);
      if(pxU8.length===GRID_W*GRID_H*4){
        pixels=new Uint8ClampedArray(pxU8.buffer);
        imageData=new ImageData(pixels,GRID_W,GRID_H);
      }
      if(save.codes){
        const codeU8=b64ToBytes(save.codes);
        if(codeU8.length===GRID_W*GRID_H*2) cellCodeIdx=new Uint16Array(codeU8.buffer);
        else cellCodeIdx.fill(NO_CODE);
      }else{
        cellCodeIdx.fill(NO_CODE);
      }
    }catch(e){ return false; }
    // 旧版（v<2）存档：把不透明纯白归一化为空色块，并清空对应编号（保持“有编号⟹不透明”）
    if(!save.v||save.v<2){
      normalizeLegacyPixels(pixels);
      if(cellCodeIdx) for(let i=0;i<cellCodeIdx.length;i++) if(pixels[i*4+3]===0) cellCodeIdx[i]=NO_CODE;
    }
    matchedPalette=null; matchedCard=null;
    if(save.card){
      const card=cardById(save.card);
      if(card){
        matchedPalette=buildMatchPalette(save.card);
        matchedCard=card;
      }
    }
    showCodes=!!save.showCodes;
    updateCodeBtn();
    if(Array.isArray(save.rulers)) rulers=save.rulers;
    if(save.lastImport&&save.lastImport.w===GRID_W&&save.lastImport.h===GRID_H&&save.lastImport.px){
      try{
        const liU8=b64ToBytes(save.lastImport.px);
        if(liU8.length===GRID_W*GRID_H*4){
          lastImported={w:GRID_W,h:GRID_H,data:{pixels:new Uint8ClampedArray(liU8.buffer)}};
          if(!save.v||save.v<2) normalizeLegacyPixels(lastImported.data.pixels);
        }
      }catch(e){}
    }
    gridWInput.value=GRID_W; gridHInput.value=GRID_H;
    if(GRID_W===GRID_H){ squareSlider.value=GRID_W; squareSliderVal.textContent=GRID_W; }
    undoStack.length=0; redoStack.length=0; syncUndoRedo();
    // 恢复存档视为新画布：清除手动绘制标记
    userEdited=false;
    render();
    statusEl.textContent='已恢复上次保存的画布';
    return true;
  }
  document.addEventListener('keydown',e=>{
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='s'){
      e.preventDefault();
      saveNow('已保存（Ctrl+S）');
    }
  });

  // ---- 画布草稿库 ----
  const DRAFT_KEY_V2='pixel_board_drafts_v2';
  const DRAFT_KEY_V1='pixel_board_drafts_v1';
  let drafts=[];            // 草稿数组（对象），展示按 updatedAt 倒序
  let currentDraftId=null;  // 当前画布对应的草稿 id（启动后恒有值）
  let lastOpenId=null;
  let dirty=false;          // 有未写回的改动
  let autoSaveTimer=null;
  const thumbCache={};      // 缩略图缓存（id → dataURL，不持久化）
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  // 单调递增的“最近修改”时间戳：避免同一毫秒内多次创建/编辑导致画廊倒序不稳定
  function nextStamp(){
    const n=Date.now();
    const mx=drafts.reduce((a,d)=>Math.max(a,d.updatedAt||0),0);
    return n>mx?n:mx+1;
  }
  function fmtTime(ts){
    const d=new Date(ts), p=n=>String(n).padStart(2,'0');
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function autoName(){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return '草稿 '+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function escHtml(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function findDraft(id){ return drafts.find(d=>d.id===id); }
  function loadDraftsV2(){
    drafts=[]; lastOpenId=null;
    try{
      const raw=localStorage.getItem(DRAFT_KEY_V2);
      if(raw){
        const data=JSON.parse(raw);
        if(Array.isArray(data.drafts)) drafts=data.drafts.filter(d=>d&&d.id&&d.px);
        if(typeof data.lastOpen==='string'&&drafts.some(d=>d.id===data.lastOpen)) lastOpenId=data.lastOpen;
      }
    }catch(e){ drafts=[]; }
    if(drafts.length&&!lastOpenId) lastOpenId=drafts.reduce((a,b)=>a.updatedAt>=b.updatedAt?a:b).id;
  }
  function saveDraftsV2(){
    try{
      localStorage.setItem(DRAFT_KEY_V2,JSON.stringify({drafts:drafts,lastOpen:currentDraftId||lastOpenId}));
      return true;
    }catch(e){ return false; }
  }
  // 序列化当前画布的全部载荷（像素、色号、导入原图、匹配色卡、编号开关、标尺）
  function serializeCurrent(){
    const d={
      w:GRID_W, h:GRID_H,
      px:bytesToB64(new Uint8Array(pixels.buffer,pixels.byteOffset,pixels.byteLength)),
      codes:cellCodeIdx?bytesToB64(new Uint8Array(cellCodeIdx.buffer,cellCodeIdx.byteOffset,cellCodeIdx.byteLength)):null
    };
    // 每张草稿一并保存它自己导入的原图快照，避免切换画布后匹配色卡误用最后导入的图片
    if(lastImported&&lastImported.data&&lastImported.data.pixels){
      d.lw=lastImported.w; d.lh=lastImported.h;
      d.lpx=bytesToB64(new Uint8Array(lastImported.data.pixels.buffer,lastImported.data.pixels.byteOffset,lastImported.data.pixels.byteLength));
    }
    // 保存导入原图的高分辨率像素（PNG dataURL），载回草稿后据此按原图重新栅格化
    if(importedImgDataURL) d.oimg=importedImgDataURL;
    // 保存当前画布的色卡匹配信息（记录匹配的是哪个色卡），载入草稿时一并还原
    if(matchedCard) d.card=matchedCard.id;
    d.showCodes=!!showCodes;
    if(rulers.length) d.rulers=rulers.map(r=>({a:{gx:r.a.gx,gy:r.a.gy},b:{gx:r.b.gx,gy:r.b.gy},off:r.off}));
    return d;
  }
  function applyDraft(d){
    if(!d||!d.px) return;
    const w=d.w||GRID_W, h=d.h||GRID_H;
    if(w!==GRID_W||h!==GRID_H){ GRID_W=w; GRID_H=h; rebuildGrid(); }
    symX=GRID_W/2; symY=GRID_H/2;   // 载入草稿后对称轴回到画布中央
    const pxU8=b64ToBytes(d.px);
    if(pxU8.length===GRID_W*GRID_H*4){
      pixels=new Uint8ClampedArray(pxU8.buffer);
      imageData=new ImageData(pixels,GRID_W,GRID_H);
    }
    cellCodeIdx.fill(NO_CODE);
    if(d.codes){
      const cu=b64ToBytes(d.codes);
      if(cu.length===GRID_W*GRID_H*2) cellCodeIdx=new Uint16Array(cu.buffer);
    }
    // 载入草稿时恢复该画布自己导入的原图快照；并清掉上个画布残留的 Image/原图像素，
    // 否则匹配色卡/调整尺寸会用错原图。老草稿（无 lpx）则快照置空。
    if(d.lpx&&d.lw&&d.lh){
      const lu=b64ToBytes(d.lpx);
      lastImported={w:d.lw,h:d.lh,data:{pixels:new Uint8ClampedArray(lu.buffer)}};
    }else{
      lastImported=null;
    }
    importedImg=null; origImg=null; importedImgDataURL=null;
    restoreImgToken++;   // 使任何在途的原图加载失效，避免误装到当前草稿
    // 持久化的导入原图（PNG）：异步恢复 Image 元素与原始像素，
    // 缩放/匹配据此走与实时导入完全相同的重栅格化（canvas 绘制），不依赖已量化快照
    if(d.oimg){
      importedImgDataURL=d.oimg;
      const token=++restoreImgToken;
      const im=new Image();
      im.onload=function(){
        if(token!==restoreImgToken) return;
        importedImg=im;
        origImg=readImageRaw(im)||null;
      };
      im.src=d.oimg;
    }
    matchedPalette=null; matchedCard=null;
    // 载入草稿时还原保存的色卡匹配状态（记录的是哪个色卡）
    if(d.card){
      const card=cardById(d.card);
      if(card){
        matchedPalette=buildMatchPalette(d.card);
        matchedCard=card;
      }
    }
    showCodes=!!d.showCodes; updateCodeBtn();
    clearSelection();
    rulers=Array.isArray(d.rulers)?d.rulers:[];
    undoStack.length=0; redoStack.length=0; syncUndoRedo();
    gridWInput.value=GRID_W; gridHInput.value=GRID_H;
    if(GRID_W===GRID_H){ squareSlider.value=GRID_W; squareSliderVal.textContent=GRID_W; }
    // 载入草稿一律回到完整视图，避免沿用旧缩放/平移导致画面被裁切错位（同尺寸草稿不会触发 rebuildGrid 复位视图）
    mag=1; offX=0; offY=0;
    // 载入草稿视为新画布：清除手动绘制标记，避免上个画布的锁定状态残留
    userEdited=false;
    // 没有导入原图、仅含作画痕迹的草稿：锁定画布尺寸，避免误触导致画面拉伸畸变
    //（有原图快照/原图像素的可按原图重栅格化，无原图只能最近邻拉伸，故须锁定；render() 会刷新锁定 UI）
    if(!lastImported&&!d.oimg&&!isCanvasBlank()) userEdited=true;
    render();
  }
  function draftThumb(d){
    const src=document.createElement('canvas');
    src.width=d.w; src.height=d.h;
    src.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(b64ToBytes(d.px)),d.w,d.h),0,0);
    const tw=288, th=288, c=document.createElement('canvas');
    c.width=tw; c.height=th;
    const cx=c.getContext('2d');
    cx.fillStyle='#fff'; cx.fillRect(0,0,tw,th);
    const s=Math.min(tw/d.w, th/d.h);
    const dw=Math.round(d.w*s), dh=Math.round(d.h*s);
    cx.imageSmoothingEnabled=false;
    cx.drawImage(src,0,0,d.w,d.h,Math.round((tw-dw)/2),Math.round((th-dh)/2),dw,dh);
    return c.toDataURL('image/png');
  }
  function getThumb(d){
    if(thumbCache[d.id]) return thumbCache[d.id];
    const t=draftThumb(d); thumbCache[d.id]=t; return t;
  }
  // ---- 自动保存：编辑后防抖写回当前草稿 ----
  function scheduleAutoSave(){
    if(!currentDraftId) return;
    dirty=true;
    if(autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer=setTimeout(()=>{ autoSaveTimer=null; flushAutoSave(); },700);
  }
  function flushAutoSave(){
    if(autoSaveTimer){ clearTimeout(autoSaveTimer); autoSaveTimer=null; }
    if(!dirty||!currentDraftId) return;
    const d=findDraft(currentDraftId);
    if(!d) return;
    dirty=false;
    const p=serializeCurrent();
    d.w=p.w; d.h=p.h; d.px=p.px; d.codes=p.codes;
    d.lw=p.lw; d.lh=p.lh; d.lpx=p.lpx; d.card=p.card;
    d.oimg=p.oimg;
    d.showCodes=p.showCodes; d.rulers=p.rulers;
    d.updatedAt=nextStamp();
    delete thumbCache[d.id];
    if(!saveDraftsV2()){
      dirty=true;
      if(statusEl) statusEl.textContent='保存失败：本地存储空间不足，请删除部分草稿';
    }
  }
  // ---- 画廊操作 ----
  function openDraft(id){
    const d=findDraft(id);
    if(!d) return;
    flushAutoSave();
    applyDraft(d);
    currentDraftId=id; lastOpenId=id;
    setDraftLib(false);
    if(statusEl) statusEl.textContent='已打开草稿「'+d.name+'」';
  }
  function newCanvas(){
    flushAutoSave();
    const w=GRID_W, h=GRID_H;
    const draft={id:uid(), name:autoName(), createdAt:Date.now(), updatedAt:nextStamp(),
      w:w, h:h, px:bytesToB64(new Uint8ClampedArray(w*h*4)), showCodes:false, rulers:[]};
    drafts.push(draft);
    applyDraft(draft);
    currentDraftId=draft.id; lastOpenId=draft.id;
    saveDraftsV2();
    setDraftLib(false);
    if(statusEl) statusEl.textContent='已新建画布「'+draft.name+'」';

  function deleteDraft(id){
    if(id===currentDraftId){
      if(statusEl) statusEl.textContent='当前画布正在编辑，请先打开其他草稿';
      return;
    }
    const d=findDraft(id);
    if(!d) return;
    if(!confirm('删除草稿「'+d.name+'」？此操作不可恢复。')) return;
    drafts=drafts.filter(x=>x.id!==id);
    delete thumbCache[id];
    if(lastOpenId===id) lastOpenId=null;
    saveDraftsV2();
    renderDraftLib();
    if(statusEl) statusEl.textContent='已删除草稿「'+d.name+'」';
  }
  function renameDraft(id,name){
    const d=findDraft(id);
    if(!d) return;
    name=(name||'').trim();
    if(!name||name===d.name) return;
    d.name=name;
    saveDraftsV2();
    renderDraftLib();
  }
  function duplicateDraft(id){
    const src=findDraft(id);
    if(!src) return;
    const copy=JSON.parse(JSON.stringify(src));
    copy.id=uid(); copy.name=src.name+' 副本';
    copy.createdAt=Date.now(); copy.updatedAt=nextStamp();
    drafts.push(copy);
    saveDraftsV2();
    renderDraftLib();
    if(statusEl) statusEl.textContent='已复制草稿「'+copy.name+'」';

  // 在 MATCH_CARDS 里找包含该 id（色卡或其子集）的顶层色卡
  function cardRootOf(id){
    for(let i=0;i<MATCH_CARDS.length;i++){
      const c=MATCH_CARDS[i];
      if(c.id===id) return c;
      if(c.subsets){
        for(let j=0;j<c.subsets.length;j++) if(c.subsets[j].id===id) return c;
      }
    }
    return null;
  }
  // 导出草稿为 .json 文件（自包含：像素、编号、导入原图、匹配色卡、标尺），可发给其他用户导入
  function exportDraftToFile(id){
    flushAutoSave();
    const d=findDraft(id);
    if(!d) return;
    const payload={
      app:'pixel-board-draft',
      version:1,
      draft:{
        name:d.name||'草稿',
        w:d.w, h:d.h, px:d.px, codes:d.codes||null,
        lw:d.lw||null, lh:d.lh||null, lpx:d.lpx||null,
        oimg:d.oimg||null,
        card:d.card||null,
        showCodes:!!d.showCodes,
        rulers:Array.isArray(d.rulers)?d.rulers:[]
      }
    };
    // 匹配的是用户自定义导入的色卡时内嵌色卡数据，对方无需再导入该卡也能还原编号；
    // 内建色卡（MARD/COCO）对方自带，不内嵌以减小文件体积。
    if(payload.draft.card){
      const root=cardRootOf(payload.draft.card);
      if(root && importedCardIndex(root.id)>=0){
        payload.draft.cardData={id:root.id, name:root.name, colors:root.colors};
      }
    }
    const json=JSON.stringify(payload);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=(d.name||'草稿').replace(/[\\/:*?"<>|]/g,'_')+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    if(statusEl) statusEl.textContent='已导出草稿「'+(d.name||'')+'」为草稿文件';
  }
  // 导入他人分享的草稿文件（.json），校验后新建草稿并打开
  function importDraftFile(file){
    const reader=new FileReader();
    reader.onload=function(){
      let data=null;
      try{ data=JSON.parse(reader.result); }catch(e){ data=null; }
      const dd=data&&data.draft;
      if(!data || data.app!=='pixel-board-draft' || !dd || typeof dd.px!=='string' || !(dd.w>0) || !(dd.h>0)){
        alert('不是有效的画板草稿文件（应为本应用导出的 .json 草稿文件）');
        return;
      }
      // 校验像素 base64 长度，避免损坏文件导入后变成空白画布
      try{
        const pxU8=b64ToBytes(dd.px);
        if(pxU8.length!==dd.w*dd.h*4) throw new Error('px length');
      }catch(e){
        alert('草稿文件已损坏，无法导入');
        return;
      }
      // 草稿引用的是自定义导入色卡时，自动注册该卡（已存在则跳过，沿用对方已有的卡）
      if(dd.cardData && dd.cardData.id && Array.isArray(dd.cardData.colors) && dd.cardData.colors.length && !cardById(dd.cardData.id)){
        addImportedCard(dd.cardData.id, dd.cardData.name||dd.cardData.id, dd.cardData.colors, true);
      }
      const name=(typeof dd.name==='string'&&dd.name.trim())?dd.name.trim()+' (导入)':'导入的草稿';
      const draft={
        id:uid(), name:name, createdAt:Date.now(), updatedAt:nextStamp(),
        w:dd.w, h:dd.h, px:dd.px, codes:dd.codes||null,
        lw:dd.lw||null, lh:dd.lh||null, lpx:dd.lpx||null,
        oimg:dd.oimg||null,
        card:dd.card||null,
        showCodes:!!dd.showCodes,
        rulers:Array.isArray(dd.rulers)?dd.rulers:[]
      };
      drafts.push(draft);
      saveDraftsV2();
      renderDraftLib();
      openDraft(draft.id);
      if(statusEl) statusEl.textContent='已导入草稿「'+name+'」';
    };
    reader.onerror=function(){ alert('读取文件失败'); };
    reader.readAsText(file);
  }

  function startRename(card,id){

  function buildHelpPages(){

    // 放不下就新开一页，超一页的内容自动分页而不是滚动。

    });

    const maxH=helpPageEl.clientHeight;
    const measure=idxArr=>{ helpPageEl.innerHTML=idxArr.map(j=>helpBlocks[j].html).join(''); return helpPageEl.scrollHeight; };
    let cur=[], i=0;
    while(i<helpBlocks.length){
      const isTitle=helpBlocks[i].html.indexOf('<div class="h-title"')===0;
      // 每个目录从新的一页起头：遇到标题块总是先新开一页
      if(isTitle&&cur.length){ helpPages.push(cur); cur=[]; }
      // 标题块连同其第一条内容一起判定，避免标题孤悬页尾
      let take=isTitle&&helpBlocks[i+1]?2:1;
      const added=[]; for(let k=0;k<take;k++) added.push(i+k);
      let tryBlocks=cur.concat(added);
      if(cur.length&&measure(tryBlocks)>maxH+1){
        helpPages.push(cur); cur=[];
        tryBlocks=added;
        measure(tryBlocks);
      }
      cur=tryBlocks;
      i+=take;
    }
    if(cur.length) helpPages.push(cur);
    helpPageEl.style.visibility='';
  }
  function paintHelpToc(){
    const onPage=new Set((helpPages[helpCur]||[]).map(bi=>helpBlocks[bi].si));
    helpToc.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('active', onPage.has(parseInt(b.dataset.sec,10)));
    });
  }
  function renderHelpPage(){
    const idxs=helpPages[helpCur]||[];
    helpPageEl.innerHTML=idxs.map(bi=>helpBlocks[bi].html).join('');
    helpPageInfo.textContent=(helpCur+1)+' / '+helpPages.length;
    helpPrev.disabled=helpCur===0;
    helpNext.disabled=helpCur===helpPages.length-1;
    paintHelpToc();
  }
  function goHelp(i){
    if(i===helpCur||i<0||i>=helpPages.length) return;
    helpCur=i;
    renderHelpPage();
    helpPageEl.scrollTop=0;
  }
  document.getElementById('helpBtn').addEventListener('click',()=>{
    helpOverlay.style.display='block';   // 先显示，保证分页测量用到真实的宽高
    buildHelpPages();
    helpToc.innerHTML='';
    // 每个书签对应一个分类，指向该分类第一页；当前页显示的分类保持高亮
    const firstPage=[];
    helpPages.forEach((idxs,pi)=>idxs.forEach(bi=>{ if(firstPage[helpBlocks[bi].si]===undefined) firstPage[helpBlocks[bi].si]=pi; }));
    HELP_SECTIONS.forEach((sec,si)=>{
      const b=document.createElement('button');
      b.textContent=sec.t;
      b.dataset.sec=si;
      b.dataset.first=firstPage[si]!==undefined?firstPage[si]:0;
      b.addEventListener('click',()=>goHelp(parseInt(b.dataset.first,10)));
      helpToc.appendChild(b);
    });
    helpCur=0;
    renderHelpPage();
  });
  helpClose.addEventListener('click',()=>helpOverlay.style.display='none');
  helpOverlay.addEventListener('mousedown',e=>{
    if(e.target===helpOverlay) helpOverlay.style.display='none';
  });
  helpPrev.addEventListener('click',()=>goHelp(helpCur-1));
  helpNext.addEventListener('click',()=>goHelp(helpCur+1));
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&helpOverlay.style.display!=='none') helpOverlay.style.display='none';
  });
  // 拖动标题栏移动弹窗（初始用 transform 居中，拖动时切换为 left/top 定位）
  helpTitlebar.addEventListener('mousedown',e=>{
    if(e.target.closest('.help-close')) return;
    const r=helpBook.getBoundingClientRect();
    helpBook.style.transform='none';
    helpBook.style.left=r.left+'px';
    helpBook.style.top=r.top+'px';
    const dx=e.clientX-r.left, dy=e.clientY-r.top;
    const onMove=ev=>{
      helpBook.style.left=Math.min(Math.max(ev.clientX-dx,0),window.innerWidth-r.width)+'px';
      helpBook.style.top=Math.min(Math.max(ev.clientY-dy,0),window.innerHeight-r.height)+'px';
    };
    const onUp=()=>{
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
  draftLibGrid.addEventListener('click',e=>{
    if(e.target.closest('.draft-name-input')) return;  // 正在改名，忽略点击
    const card=e.target.closest('.draft-card');
    if(!card) return;
    const id=card.getAttribute('data-id');
    const actBtn=e.target.closest('[data-act]');
    if(actBtn){
      const act=actBtn.getAttribute('data-act');
      if(act==='del') deleteDraft(id);
      else if(act==='dup') duplicateDraft(id);
      else if(act==='rename') startRename(card,id);
      else if(act==='export') exportDraftToFile(id);
      return;
    }
    openDraft(id);
  });
  // 初始化 / 迁移：v2 → v1 槽位 → 上次 Ctrl+S 画布 → 全新空白草稿
  function initDraftsV2(){
    loadDraftsV2();
    if(drafts.length){
      const target=findDraft(lastOpenId)||[...drafts].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
      applyDraft(target);
      currentDraftId=target.id; lastOpenId=target.id;
      if(statusEl) statusEl.textContent='已打开草稿「'+target.name+'」';
      return;
    }
    let migrated=0;
    try{
      const raw=localStorage.getItem(DRAFT_KEY_V1);
      if(raw){
        const arr=JSON.parse(raw);
        if(Array.isArray(arr)){
          for(let i=0;i<arr.length;i++){
            if(arr[i]&&arr[i].px){
              drafts.push({id:uid(), name:'草稿 '+(i+1), createdAt:Date.now(), updatedAt:nextStamp(),
                w:arr[i].w, h:arr[i].h, px:arr[i].px, codes:arr[i].codes, lw:arr[i].lw, lh:arr[i].lh, lpx:arr[i].lpx,
                card:arr[i].card, showCodes:!!arr[i].showCodes,
                rulers:Array.isArray(arr[i].rulers)?arr[i].rulers:undefined});
              migrated++;
            }
          }
        }
      }
    }catch(e){}
    if(!migrated && localStorage.getItem(SAVE_KEY)){
      if(loadState()){
        const p=serializeCurrent();
        drafts.push({id:uid(), name:'草稿 1', createdAt:Date.now(), updatedAt:nextStamp(),
          w:p.w, h:p.h, px:p.px, codes:p.codes, lw:p.lw, lh:p.lh, lpx:p.lpx,
          card:p.card, showCodes:p.showCodes, rulers:p.rulers});
        migrated++;
      }
    }
    if(migrated){
      const target=[...drafts].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
      applyDraft(target);
      currentDraftId=target.id; lastOpenId=target.id;
      saveDraftsV2();
      if(statusEl) statusEl.textContent='已迁移 '+migrated+' 张草稿，打开「'+target.name+'」';
      return;
    }
    // 全新用户：建初始空白草稿，直接作为当前画布
    const blank={id:uid(), name:'草稿 1', createdAt:Date.now(), updatedAt:nextStamp(),
      w:GRID_W, h:GRID_H, px:bytesToB64(new Uint8ClampedArray(GRID_W*GRID_H*4)), showCodes:false, rulers:[]};
    drafts.push(blank);
    currentDraftId=blank.id; lastOpenId=blank.id;
    saveDraftsV2();
  }

  // ---- 初始化：直接生成默认 200×200 画布 ----
  GRID_W=200; GRID_H=200;
  undoStack.length=0; redoStack.length=0;
  syncUndoRedo();
  rebuildGrid();
  canvas.style.display='block';
  gridWInput.value=200; gridHInput.value=200;
  squareSlider.value='200';
  squareSliderVal.textContent=200;
  statusEl.textContent='画布已生成：200×200';
  setCurColor('#000000');
  loadImportedCards();
  initDraftsV2();
  window.addEventListener('resize',resizeCanvas);
  window.addEventListener('beforeunload',()=>flushAutoSave());
  window.addEventListener('pagehide',()=>flushAutoSave());
})();
</script>
</body>
