<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素画板 · 400×400</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#e8e8f0;color:#222;
  font-family:"Microsoft YaHei",system-ui,"PingFang SC",sans-serif;
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}
header{
  flex:none;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:#fff;border-bottom:1px solid #d8d8e0;
}
header h1{font-size:17px;margin:0;font-weight:600}
header .hint{font-size:12px;color:#888}
.theme-btn{
  margin-left:auto;padding:6px 12px;font-size:14px;line-height:1;
  background:#fff;border:1px solid #ccc;border-radius:8px;
  cursor:pointer;color:#333;flex:none;
}
.theme-btn:hover{background:#f0f0f4}
.theme-btn:active{background:#e4e4ea}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.header-actions .theme-btn{margin-left:0}
main{
  flex:1;min-height:0;
  display:flex;gap:16px;padding:16px;
}
.canvas-area{
  flex:1;min-width:0;min-height:0;position:relative;display:flex;
}
.canvas-wrap{
  flex:1;min-width:0;min-height:0;position:relative;
  background:#fff;border:1px solid #d8d8e0;border-radius:8px;
  padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);
  overflow:auto;
  display:flex;
}
#importBtn{
  min-height:150px;   /* 高度约为原按钮的三倍，兼作拖放导入的落点 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
#importBtn .import-main{font-size:19px;line-height:1.3}
#importBtn .import-sub{font-size:13px;opacity:.85}
#importBtn.dragover{
  border:3px dashed #4a76c8;background:#eef3ff;color:#2b4a8f;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}
.corner-stack{
  position:absolute;top:10px;right:10px;z-index:6;
  display:flex;flex-direction:column;gap:6px;
}
.corner-btn{
  padding:7px 12px;font-size:14px;line-height:1;
  background:#fff;border:1px solid #ccc;border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  cursor:pointer;color:#333;
}
.corner-btn:hover{background:#f0f0f4}
.corner-btn:active{background:#e4e4ea}
.corner-btn.active{background:#e8edf7;border-color:#7b9bd6;color:#2b4a8f}
.corner-btn:disabled{opacity:.45;cursor:not-allowed;background:#f7f7f7}
.code-count{
  font-size:12px;color:#555;background:#fff;
  border:1px solid #e0e0e0;border-radius:6px;
  padding:3px 8px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.08);line-height:1.4;
}
.undo-redo-stack{
  position:absolute;bottom:10px;right:10px;z-index:6;
  display:flex;gap:6px;
}
.undo-redo-stack button{
  width:36px;height:36px;font-size:19px;line-height:1;
  background:#fff;border:1px solid #ccc;border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  cursor:pointer;color:#333;
  display:flex;align-items:center;justify-content:center;
}
.undo-redo-stack button:hover{background:#f0f0f4}
.undo-redo-stack button:active{background:#e4e4ea}
.undo-redo-stack button:disabled{opacity:.45;cursor:not-allowed;background:#f7f7f7}
#board{
  margin:auto;flex:none;cursor:crosshair;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;
  background:#fff;
}
.status{
  /* 按内容收缩：短状态一条短框，长状态被 max-width 封顶后换行，完整显示不占全宽 */
  position:absolute;bottom:8px;left:12px;
  width:max-content;max-width:calc(100% - 24px);
  background:rgba(255,255,255,.92);
  font-size:12px;color:#666;
  font-family:Consolas,monospace;min-height:16px;
  overflow-wrap:anywhere;white-space:normal;
  padding:2px 8px;border-radius:6px;
  pointer-events:none;
}
aside,.side-panel{
  flex:none;width:325px;min-height:0;overflow-y:auto;
  background:#fff;border:1px solid #d8d8e0;border-radius:8px;
  padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:12px;
}
aside h2{font-size:16px;margin:0 0 8px;color:#444;border-bottom:1px solid #eee;padding-bottom:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button{
  flex:1 1 45%;padding:8px 0;border:1px solid #ccc;background:#fff;border-radius:6px;
  cursor:pointer;font-size:16px;
}
.tools button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.palette .swatch{
  aspect-ratio:1;border-radius:4px;cursor:pointer;border:2px solid rgba(0,0,0,.12);
  transition:transform .06s;padding:0;
}
.palette .swatch:hover{transform:scale(1.12)}
.palette .swatch.active{border-color:#2563eb;box-shadow:0 0 0 2px #fff inset}
.palette .swatch.custom{position:relative;background:conic-gradient(#f2b8b8,#f5dfb0,#e8efae,#b3e8c9,#b3cdf2,#cbb3f2,#f2b3d9,#f2b8b8)}
.palette .swatch.custom::after{
  content:'＋';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#777;font-size:16px;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.history{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:2px}
.history .h-swatch{
  aspect-ratio:1;border-radius:4px;cursor:pointer;border:2px solid rgba(0,0,0,.12);
  transition:transform .06s;padding:0;background:#f2f2f5;
}
.history .h-swatch:hover{transform:scale(1.12)}
.history .h-swatch.empty{cursor:default;border-color:rgba(0,0,0,.06)}
.history .h-swatch.empty:hover{transform:none}
.wheel-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,20,35,.45);
}
.wheel-box{
  background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);
  padding:20px 24px;width:310px;display:flex;flex-direction:column;gap:14px;align-items:stretch;
}
.wheel-box h2{margin:0;font-size:16px;color:#333;text-align:center}
#wheelCanvas{cursor:crosshair;touch-action:none;align-self:center;border-radius:8px}
.wheel-preview{display:flex;align-items:center;gap:10px}
.wheel-preview-swatch{width:38px;height:38px;border-radius:6px;border:1px solid #ccc;flex:none}
#wheelHex{flex:1;font-family:Consolas,monospace;font-size:16px;padding:6px 8px;border:1px solid #ccc;border-radius:6px}
.wheel-box .btn-primary{padding:10px 0;font-size:16px}
.bead-panel{
  flex:none;width:325px;min-height:0;overflow-y:auto;
  background:#fff;border:1px solid #d8d8e0;border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  display:flex;flex-direction:column;
}
.bead-panel-head{
  flex:none;font-size:16px;font-weight:700;color:#333;
  border-bottom:1px solid #eee;padding:12px 14px;
  display:flex;align-items:center;gap:8px;
}
.bead-panel-head::before{
  content:'';width:4px;height:16px;background:#2563eb;border-radius:2px;flex:none;
}
.bead-code-toggle{
  font-size:12px;color:#2563eb;background:#eff4ff;
  border:1px solid #dbe3f8;border-radius:5px;padding:3px 8px;cursor:pointer;flex:none;
}
.bead-code-toggle:hover{background:#e0eaff}
.bead-subset-select{
  margin-left:auto;font-size:12px;color:#333;background:#fff;
  border:1px solid #d0d0d0;border-radius:5px;padding:3px 6px;cursor:pointer;flex:none;max-width:140px;
}
.bead-close{
  font-size:14px;color:#888;background:none;border:none;border-radius:5px;
  padding:2px 7px;cursor:pointer;flex:none;line-height:1;
}
.bead-close:hover{background:#fde8e8;color:#c0392b}
.bead-panel-body.hide-codes .bead-code{display:none}
.bead-panel-body{flex:1;min-height:0;overflow-y:auto;padding:12px;font-size:14px;color:#666}
.bead-brand-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bead-title{
  cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:6px;position:relative;
  border:1px solid #ccc;border-radius:6px;padding:9px 10px;font-size:16px;color:#444;
  background:#fff;
}
.bead-title:hover{border-color:#2563eb;color:#2563eb}
.bead-title.active{border-color:#2563eb;color:#2563eb;background:#eff4ff}
.bead-title .bead-arrow{display:inline-block;color:#999;font-size:12px;transition:transform .15s;margin-left:auto}
.bead-title .bead-del{
  position:absolute;top:3px;right:3px;z-index:2;
  width:18px;height:18px;line-height:16px;text-align:center;
  background:#ef4444;color:#fff;border-radius:50%;
  font-size:11px;cursor:pointer;user-select:none;
}
.bead-title .bead-del:hover{background:#dc2626}
.bead-title.active .bead-arrow{transform:rotate(90deg)}
.card-import-row{display:flex;align-items:center;gap:8px;margin-top:10px;border-top:1px solid #eee;padding-top:10px}
.card-import-row .btn-plain{flex:1;text-align:center}
.card-import-row .btn-plain.active{background:#dbe7ff;border-color:#a7c4ff;color:#1a4bd4;font-weight:600}
.card-import-hint{margin-top:6px;font-size:12px;color:#999;line-height:1.5}
.bead-overview{
  font-size:14px;font-weight:600;color:#2563eb;cursor:pointer;user-select:none;
  display:flex;align-items:center;
  background:#f3f6ff;border:1px solid #dbe3f8;border-radius:6px;
  padding:8px 10px;margin-bottom:10px;
}
.bead-overview:hover{background:#e8eefc}
.bead-series{margin-bottom:14px}
.bead-series-title{
  font-size:14px;font-weight:600;color:#555;margin:0 0 8px;
  border-bottom:1px solid #eee;padding-bottom:4px;
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;
}
.bead-series-title:hover{color:#2563eb}
.bead-series-title::after{content:'▾';margin-left:auto;color:#999;font-size:12px;transition:transform .15s}
.bead-series.collapsed .bead-series-title::after{transform:rotate(-90deg)}
.bead-series.collapsed .bead-series-grid{display:none}
.bead-series-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 4px}
.bead-color-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.bead-color{width:100%;aspect-ratio:1;border-radius:4px;cursor:pointer;border:1px solid rgba(0,0,0,.15);padding:0}
.bead-color:hover{transform:scale(1.15);border-color:#2563eb;position:relative;z-index:2}
.bead-color.disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.bead-color.disabled:hover{transform:none;border-color:rgba(0,0,0,.15);position:static;z-index:auto}
.bead-code{font-size:14px;color:#666;line-height:1;user-select:none}
.bead-code.disabled{color:#c0c0c0}
.bead-empty{color:#aaa;text-align:center;margin:24px 0}
.picker-row{display:flex;align-items:center;gap:8px}
#colorInput{width:44px;height:34px;padding:0;border:1px solid #ccc;border-radius:6px;background:none;cursor:pointer;flex:none}
#hexText{
  flex:1;font-family:Consolas,monospace;font-size:16px;padding:6px 8px;
  border:1px solid #ccc;border-radius:6px;min-width:0;
}
#colorConfirm{flex:none;height:34px;padding:0 12px;border-radius:6px;cursor:pointer;font-size:15px}
.actions{display:flex;flex-direction:column;gap:6px}
.actions button{padding:9px 0;border-radius:6px;cursor:pointer;font-size:16px}
.btn-primary{background:#2563eb;color:#fff;border:1px solid #2563eb}
.btn-plain{background:#fff;border:1px solid #ccc}
#exportBtn,#clearBtn{height:54px}   /* 高约增至原来的 1.5 倍 */
.zoom-row{display:none}  /* 显示倍率与 Ctrl+滚轮重复，冗余，隐藏 */
.match-popup{
  position:absolute;top:76px;right:10px;z-index:6;
  background:#fff;border:1px solid #ccc;border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);
  padding:6px;min-width:160px;
  display:flex;flex-direction:column;gap:4px;
  max-height:calc(100vh - 120px);overflow-y:auto;
}
.match-popup button{
  padding:8px 10px;font-size:15px;text-align:left;
  border:none;background:transparent;border-radius:6px;cursor:pointer;color:#333;
  display:flex;align-items:center;gap:8px;
}
.match-popup button:hover{background:#f0f0f4}
.match-popup button.active{background:#dbe7ff;color:#1a4bd4;font-weight:600}
.match-popup button:disabled{color:#bbb;cursor:not-allowed;background:transparent}
.match-popup .restore{border-bottom:1px solid #f0f0f0;border-radius:6px 6px 0 0}
.match-popup .match-strip{display:flex;gap:1px;border:1px solid #ddd;border-radius:3px;overflow:hidden;flex:none}
.match-popup .match-strip i{width:9px;height:16px;display:block}
.match-popup .sub-toggle .sub-name{flex:1}
.match-popup .sub-toggle .sub-arrow{font-size:12px;color:#999;flex:none}
.match-popup .match-submenu{background:#f5f6fa;border-top:1px solid #eee;border-bottom:1px solid #eee}
.match-popup .match-submenu .sub-opt{padding-left:26px;font-size:14px}
.size-row{display:flex;gap:8px}
.size-row label{display:flex;align-items:center;gap:4px;font-size:16px;color:#444;flex:1}
.size-row input{flex:1;min-width:0;padding:5px;border:1px solid #ccc;border-radius:6px;font-size:16px}
.preset-row{display:flex;gap:6px;margin-top:8px}
.preset-row .btn-plain{flex:1;padding:5px 2px;font-size:12px;line-height:1.25;text-align:center}
.select-row{display:none;gap:8px;margin-top:10px}
.select-row.show{display:flex}
.select-row .btn-plain{flex:1;padding:7px 4px;font-size:14px;text-align:center;transition:transform .08s ease, background-color .15s ease}
.select-row .btn-plain:active{transform:scale(.93);background:#e4e4ea}
.ruler-popup{position:fixed;z-index:60;background:#fff;border:1px solid #ccc;border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.ruler-popup button{background:none;border:none;padding:7px 12px;font-size:14px;border-radius:6px;
  cursor:pointer;text-align:left;white-space:nowrap}
.ruler-popup button:hover{background:#eff4ff}
.export-inline{
  display:none;flex-direction:column;gap:2px;
  background:#f7f7fa;border:1px solid #e2e2e8;border-radius:8px;padding:6px;
}
.export-inline button{background:none;border:none;padding:6px 10px;font-size:14px;border-radius:6px;
  cursor:pointer;text-align:left;white-space:nowrap}
.export-inline button:hover{background:#e9eefb}
.export-empty-row{display:flex;align-items:center;gap:4px;padding:6px 10px;border-top:1px solid #f0f0f0}
.export-empty-label{font-size:13px;color:#888;margin-right:2px}
.export-empty-btn{padding:3px 10px;font-size:13px;border:1px solid #d0d0d0;border-radius:5px;
  background:#fff;color:#444;cursor:pointer;flex:none}
.export-empty-btn.active{background:#dbe7ff;border-color:#a7c4ff;color:#1a4bd4;font-weight:600}
.export-stats{font-size:12px;color:#888;padding:6px 10px;border-top:1px solid #f0f0f0;line-height:1.5}
.slider-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:#444}
.slider-label{flex:none}
.slider-row input[type=range]{flex:1;min-width:0}
.slider-row span{min-width:38px;text-align:right;font-family:Consolas,monospace;font-size:15px;color:#333}
.size-lock-hint{margin:8px 0 0;font-size:13px;color:#d97706;line-height:1.5}
body.dark .size-lock-hint{color:#f0b45c}
.size-frame{
  border:2px solid #ccc;
  border-radius:12px;
  padding:12px;
  background:#fff;
}
.size-frame h2{margin-top:0}
body.dark .size-frame{background:#23242d;border-color:#4a4b58}
.sym-row{display:none;flex-wrap:wrap;gap:4px;margin-top:10px}
.sym-row.show{display:flex}
.sym-row button{flex:1 1 30%;padding:6px 0;font-size:13px;border:1px solid #d0d0d0;border-radius:5px;
  background:#fff;color:#444;cursor:pointer;text-align:center}
.sym-row button:hover{background:#f2f5ff}
.sym-row button.active{background:#dbe7ff;border-color:#a7c4ff;color:#1a4bd4;font-weight:600}
body.dark .sym-row button{background:#2a2b36;border-color:#44465a;color:#fff}
body.dark .sym-row button.active{background:#3a3f5c;border-color:#6d7cff;color:#bcd0ff}
.sym-row button.sym-reset{flex:1 1 100%;margin-top:2px}
.tips{font-size:15px;color:#666;line-height:1.8}
.tips p{margin:8px 0 0}
.tips p.tips-h{margin:12px 0 3px;font-weight:600;color:#333;font-size:14px}
.tips summary{
  font-size:16px;font-weight:600;color:#444;cursor:pointer;user-select:none;
  list-style:none;display:flex;align-items:center;
  border-bottom:1px solid #eee;padding-bottom:4px;
}
.tips summary::-webkit-details-marker{display:none}
.tips summary::after{content:'▸';margin-left:auto;color:#999;font-size:12px;transition:transform .15s}
.tips[open] summary::after{transform:rotate(90deg)}
/* 📖 使用说明：书页式可拖动弹窗 */
.help-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,17,22,.35);
}
.help-book{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(960px,92vw);height:min(680px,88vh);
  background:#fff;border:1px solid #d8d8e0;border-radius:12px;
  box-shadow:0 12px 44px rgba(0,0,0,.3);
  display:flex;flex-direction:column;overflow:visible;
}
.help-titlebar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:22px 14px 10px;background:#f4f5fa;border-bottom:1px solid #e2e3ea;
  border-radius:12px 12px 0 0;
  cursor:move;user-select:none;font-weight:600;color:#333;font-size:18px;
}
.help-close{
  border:none;background:transparent;font-size:16px;cursor:pointer;
  color:#888;padding:2px 8px;border-radius:6px;line-height:1;
}
.help-close:hover{background:#e4e4ea;color:#333}
.help-body{flex:1;min-height:0;display:flex}
.help-toc{
  height:0;overflow:visible;
  display:flex;gap:0;flex-wrap:wrap;
  padding:0 18px;position:relative;z-index:5;
}
.help-toc button{
  position:relative;
  border:1px solid #d8d8e0;border-bottom:none;background:#fff;cursor:pointer;
  padding:7px 14px 8px;border-radius:5px 5px 0 0;
  margin-top:-32px;
  color:#555;font-size:16px;line-height:1.3;
  box-shadow:0 -3px 8px rgba(0,0,0,.05);
}
.help-toc button + button{margin-left:-1px}
.help-toc button::after{
  content:'';position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:0;height:0;border:5px solid transparent;border-top:5px solid #f4f5fa;
}
.help-toc button:hover{background:#f4f5fa;color:#333}
.help-toc button.active{background:#e8edf7;color:#2b4a8f;font-weight:600}
.help-stage{flex:1;min-width:0;position:relative}
.help-page{
  position:absolute;inset:0;box-sizing:border-box;
  padding:20px 24px;overflow:hidden;
  font-size:18px;line-height:1.8;color:#555;
  background:#fff;
}
.help-page .h-title{
  font-size:21px;font-weight:600;color:#333;
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #eee;
}
.help-page .h-line{margin:8px 0 0}
.help-page .h-line b{font-weight:700;color:#333}
body.dark .help-page .h-line b{color:#e3e4ea}
.help-footer{
  flex:none;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:10px 14px;border-top:1px solid #eee;background:#fafbfe;
  border-radius:0 0 12px 12px;
}
.help-nav{
  border:1px solid #ccc;background:#fff;border-radius:6px;
  padding:6px 16px;cursor:pointer;font-size:16px;color:#333;
}
.help-nav:hover{background:#f0f0f4}
.help-nav:disabled{opacity:.4;cursor:not-allowed}
.help-pageinfo{font-size:16px;color:#888;min-width:80px;text-align:center}
body.no-select{user-select:none}
body.dark .help-book{background:#1d1e26;border-color:#4a4b58}
body.dark .help-titlebar{background:#23242d;border-bottom-color:#3a3b47;color:#e3e4ea}
body.dark .help-toc button{border-color:#4a4b58;background:#23242d;color:#b6b9c8}
body.dark .help-toc button::after{border-top-color:#23242d}
body.dark .help-toc button:hover{background:#2f3039;color:#e3e4ea}
body.dark .help-toc button.active{background:#2f3a55;color:#a7c4ff}
body.dark .help-page{color:#b6b9c8;background:#1d1e26}

.draft-lib{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;

.draft-card{position:relative;border:1px solid #d8d8e0;border-radius:8px;background:#fff;

.draft-meta{flex:none;padding:2px 6px 6px;font-size:11px;color:#888}
.draft-ops{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .12s}

.draft-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-align:center;

<script>
(function(){
  // 像素空间尺寸（可自定义，最大 500×500）
  const GRID_MAX = 500;
  let GRID_W = 400, GRID_H = 400;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(dark){
    document.body.classList.toggle('dark', dark);
    if(themeBtn) themeBtn.textContent = dark ? '☀️ 浅色' : '🌙 深色';
    localStorage.setItem('pixel_board_theme', dark ? 'dark' : 'light');
  }
  if(themeBtn) themeBtn.addEventListener('click', ()=>applyTheme(!document.body.classList.contains('dark')));
  applyTheme(localStorage.getItem('pixel_board_theme') === 'dark');

  // ---- 数据层：每个格子的 RGBA ----
  let pixels = new Uint8ClampedArray(GRID_W*GRID_H*4);
  let imageData = new ImageData(pixels, GRID_W, GRID_H);
  const gridCanvas = document.createElement('canvas');
  const gridCtx = gridCanvas.getContext('2d');
  // 重建网格（尺寸变化时调用，会清空内容并复位视图）
  function rebuildGrid(){
    gridCanvas.width = GRID_W;
    gridCanvas.height = GRID_H;
    pixels = new Uint8ClampedArray(GRID_W*GRID_H*4);
    fillEmpty();
    imageData = new ImageData(pixels, GRID_W, GRID_H);
    cellCodeIdx = new Uint16Array(GRID_W*GRID_H);
    cellCodeIdx.fill(NO_CODE);
    matchedPalette = null;
    matchedCard = null;
    showCodes = false;
    initSelectionCanvas();
    mag = 1; offX = 0; offY = 0;
    resizeCanvas();
    syncZoomSelect();
    updateSizeLabel();
    updateCodeBtn();
  }

  // 空色块：RGB 保持纯白（视觉上仍是白底），alpha=0 表示“无珠”，与白色珠(alpha=255)区分
  function fillEmpty(){
    pixels.fill(255);
    for(let i=3;i<pixels.length;i+=4) pixels[i]=0;
  }
  function fillWhite(){ fillEmpty(); }
  function setCell(x,y,r,g,b,raw){
    // 色卡匹配模式下（raw=false 的绘制路径），颜色自动吸附到当前子集内最接近的色卡颜色，
    // 像素与编号同时写入，保证一致；白色也会吸附为卡内白色。
    // raw=true 表示“擦除/清空”（橡皮、删除选区）：写成空色块——像素纯白、alpha=0、编号清除。
    const i=(y*GRID_W+x)*4;
    if(raw){
      pixels[i]=255;pixels[i+1]=255;pixels[i+2]=255;pixels[i+3]=0;
      cellCodeIdx[y*GRID_W+x]=NO_CODE;
      return;
    }
    if(matchedPalette){
      const nc=nearestCardColor(matchedPalette,r,g,b);
      pixels[i]=nc.r;pixels[i+1]=nc.g;pixels[i+2]=nc.b;pixels[i+3]=255;
      cellCodeIdx[y*GRID_W+x]=nc._idx;
      return;
    }
    pixels[i]=r;pixels[i+1]=g;pixels[i+2]=b;pixels[i+3]=255;
    cellCodeIdx[y*GRID_W+x]=NO_CODE;
  }
  function getCell(x,y){
    const i=(y*GRID_W+x)*4;
    return [pixels[i],pixels[i+1],pixels[i+2],pixels[i+3]];
  }
  function cellEq(x,y,r,g,b,a){
    const c=getCell(x,y);
    return c[0]===r&&c[1]===g&&c[2]===b&&(a===undefined||c[3]===a);
  }

  // 旧版（v<2）存档把“空”存成不透明纯白。加载时把 RGBA 全白单元格归一化为空（alpha=0）。
  // 数组按 RGBA 顺序，len 为像素总数。
  function normalizeLegacyPixels(arr){
    for(let i=0;i<arr.length;i+=4){
      if(arr[i]===255&&arr[i+1]===255&&arr[i+2]===255) arr[i+3]=0;
    }
  }

  // ---- 撤销 / 重做 ----
  // 快照保存像素颜色、色卡编号与画布上下文，撤销/重做一并还原。
  // 画布上下文（导入原图、匹配色卡、编号开关、尺寸锁定、标尺）也会被操作修改，
  // 若只还原像素/编号，撤回「清空画布」就会恢复画面却丢掉原图信息，导致后续缩放/匹配用错数据。
  const MAX_UNDO=50;
  let undoStack=[];
  let redoStack=[];
  function snapshot(){
    return {pixels:new Uint8ClampedArray(pixels), codes:cellCodeIdx?new Uint16Array(cellCodeIdx):null, ctx:contextState()};
  }
  // 采集当前画布上下文。lastImport 只存引用（原图快照数组从不原地修改、只会整体替换），
  // 避免每份撤销快照复制整幅像素导致 50 份历史占爆存储。
  function contextState(){
    const c={};
    if(lastImported&&lastImported.data&&lastImported.data.pixels){
      c.lastImport={w:lastImported.w,h:lastImported.h,pixels:lastImported.data.pixels};
    }
    if(importedImgDataURL) c.oimg=importedImgDataURL;
    if(matchedCard) c.card=matchedCard.id;
    c.showCodes=!!showCodes;
    c.userEdited=!!userEdited;
    if(rulers.length) c.rulers=rulers.map(r=>({a:{gx:r.a.gx,gy:r.a.gy},b:{gx:r.b.gx,gy:r.b.gy},off:r.off}));
    return c;
  }
  function restoreContextState(c){
    if(c.lastImport){
      lastImported={w:c.lastImport.w,h:c.lastImport.h,data:{pixels:c.lastImport.pixels}};
    }else{
      lastImported=null;
    }
    // 原图高分辨率像素：异步恢复 Image 元素与原始像素（与 applyDraft 相同，token 防误装）
    importedImg=null; origImg=null;
    importedImgDataURL=c.oimg||null;
    restoreImgToken++;
    if(c.oimg){
      const token=++restoreImgToken;
      const im=new Image();
      im.onload=function(){
        if(token!==restoreImgToken) return;
        importedImg=im;
        origImg=readImageRaw(im)||null;
      };
      im.src=c.oimg;
    }
    matchedPalette=null; matchedCard=null;
    if(c.card){
      const card=cardById(c.card);
      if(card){ matchedPalette=buildMatchPalette(c.card); matchedCard=card; }
    }else if(cellCodeIdx){
      cellCodeIdx.fill(NO_CODE);   // 无匹配色卡时编号无意义，清空避免残留
    }
    showCodes=!!c.showCodes;
    updateCodeBtn();
    if(typeof refreshMatchActive==='function') refreshMatchActive();
    rulers=Array.isArray(c.rulers)?c.rulers:[];
    userEdited=!!c.userEdited;
    updateSizeLock();
  }
  function samePixels(a,b){
    for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }
  // 两个画布上下文是否等价（用于「像素没变但上下文变了」也要可撤销的判断）
  function sameContext(a,b){
    if(!!a.userEdited!==!!b.userEdited) return false;
    if((a.oimg||null)!==(b.oimg||null)) return false;
    const la=a.lastImport||null, lb=b.lastImport||null;
    if(la!==lb){ if(!la||!lb||la.w!==lb.w||la.h!==lb.h||la.pixels!==lb.pixels) return false; }
    if((a.card||null)!==(b.card||null)) return false;
    if(!!a.showCodes!==!!b.showCodes) return false;
    const ra=a.rulers||[], rb=b.rulers||[];
    if(ra.length!==rb.length) return false;
    for(let i=0;i<ra.length;i++){
      if(ra[i].off!==rb[i].off||ra[i].a.gx!==rb[i].a.gx||ra[i].a.gy!==rb[i].a.gy||
         ra[i].b.gx!==rb[i].b.gx||ra[i].b.gy!==rb[i].b.gy) return false;
    }
    return true;
  }
  function pushUndo(snap){
    undoStack.push(snap);
    if(undoStack.length>MAX_UNDO) undoStack.shift();
    redoStack.length=0;
    syncUndoRedo();
    scheduleAutoSave();
  }
  function restoreSnap(s){
    if(s.ctx) restoreContextState(s.ctx);
    pixels.set(s.pixels);
    if(s.codes&&cellCodeIdx) cellCodeIdx.set(s.codes);
  }
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshot());
    restoreSnap(undoStack.pop());
    syncUndoRedo();
    render();
    scheduleAutoSave();
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshot());
    restoreSnap(redoStack.pop());
    syncUndoRedo();
    render();
    scheduleAutoSave();
  }
  function syncUndoRedo(){
    const ub=document.getElementById('undoBtn'), rb=document.getElementById('redoBtn');
    ub.disabled=!undoStack.length;
    rb.disabled=!redoStack.length;
  }
  document.getElementById('undoBtn').addEventListener('click',undo);
  document.getElementById('redoBtn').addEventListener('click',redo);

  // ---- 视图：窗口固定，内部按放大倍率显示 ----
  // mag=1 表示完整视图（整个网格完整显示），mag>1 放大局部
  let mag = 1;
  let fitCell = 1;         // 完整视图时每个格子占用的像素尺寸
  let offX = 0, offY = 0;  // 放大后网格左上角在画布窗口中的坐标
  let showGrid = true;     // 是否显示像素格的黑色边框
  let showCodes = false;   // 是否显示像素的色卡编号
  let matchedPalette = null;  // 最近一次匹配所用色卡的颜色列表（含编号）
  let matchedCard = null;     // 最近一次匹配的色卡名称
  let cellCodeIdx = null;     // 每格对应的色卡编号下标，65535 表示无
  const NO_CODE = 65535;
  const MAX_MAG = 16;
  function resizeCanvas(){
    if(!wrap) return;
    const wrapW=wrap.clientWidth, wrapH=wrap.clientHeight;
    if(!wrapW || !wrapH) return;
    const pad=24, bot=28; // pad: 左右留白, bot: 底部状态栏占位
    const W=Math.max(200,Math.floor(wrapW-pad));
    const H=Math.max(200,Math.floor(wrapH-pad-bot));
    canvas.width=W; canvas.height=H;
    fitCell=Math.min(W/GRID_W, H/GRID_H);
    if(mag<1) mag=1;
    render();
  }
  function gridSize(){
    return {w: GRID_W*mag*fitCell, h: GRID_H*mag*fitCell};
  }
  function gridOffsets(){
    const gs=gridSize();
    if(mag<=1) return {ox:(canvas.width-gs.w)/2, oy:(canvas.height-gs.h)/2};
    return {ox:offX, oy:offY};
  }
  function panBy(dx,dy){
    if(mag<=1) return;
    offX+=dx; offY+=dy;
    render();
  }
  function zoomAt(px,py,factor){
    const o=gridOffsets();
    const gs=gridSize();
    const fx=(px-o.ox)/gs.w;
    const fy=(py-o.oy)/gs.h;
    let nm=mag*factor;
    nm=Math.max(1,Math.min(MAX_MAG,nm));
    if(nm===mag) return;
    mag=nm;
    if(mag>1){
      const ngs=gridSize();
      offX=px-fx*ngs.w;
      offY=py-fy*ngs.h;
    }
    render();
    syncZoomSelect();
  }
  let pending=false;
  function requestRender(){
    if(pending) return;
    pending=true;
    requestAnimationFrame(()=>{ pending=false; render(); });
  }
  function render(){
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    gridCtx.putImageData(imageData,0,0);
    ctx.imageSmoothingEnabled=false;
    const o=gridOffsets();
    const gs=gridSize();
    ctx.drawImage(gridCanvas,0,0,GRID_W,GRID_H,o.ox,o.oy,gs.w,gs.h);
    if(showGrid){
      ctx.strokeStyle='#000';
      ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<=GRID_W;i++){
        const p=i*gs.w/GRID_W;
        ctx.moveTo(o.ox+p,o.oy);ctx.lineTo(o.ox+p,o.oy+gs.h);
      }
      for(let j=0;j<=GRID_H;j++){
        const p=j*gs.h/GRID_H;
        ctx.moveTo(o.ox,o.oy+p);ctx.lineTo(o.ox+gs.w,o.oy+p);
      }
      ctx.stroke();
    }
    if(showCodes && matchedPalette && cellCodeIdx){
      const cellW=gs.w/GRID_W;
      const cellH=gs.h/GRID_H;
      if(cellW>=8 && cellH>=8){
        const fs=Math.max(5,Math.round(Math.min(cellW,cellH)*0.5));
        ctx.font='bold '+fs+'px sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.lineWidth=Math.max(1,Math.round(fs/5));
        ctx.strokeStyle='rgba(0,0,0,0.85)';
        ctx.fillStyle='#fff';
        const x0=Math.max(0,Math.floor((0-o.ox)/cellW));
        const x1=Math.min(GRID_W-1,Math.ceil((canvas.width-o.ox)/cellW));
        const y0=Math.max(0,Math.floor((0-o.oy)/cellH));
        const y1=Math.min(GRID_H-1,Math.ceil((canvas.height-o.oy)/cellH));
        for(let y=y0;y<=y1;y++){
          for(let x=x0;x<=x1;x++){
            const idx=cellCodeIdx[y*GRID_W+x];
            if(idx===NO_CODE) continue;
            const cx=o.ox+(x+0.5)*cellW;
            const cy=o.oy+(y+0.5)*cellH;
            ctx.strokeText(matchedPalette[idx].code,cx,cy);
            ctx.fillText(matchedPalette[idx].code,cx,cy);
          }
        }
      }
    }
    if(selectionMask){
      ctx.drawImage(selCanvas,0,0,GRID_W,GRID_H,o.ox,o.oy,gs.w,gs.h);
    }
    if(rulerA || rulerPlacing || rulers.length){
      if(rulerPlacing && rulerB){
        // 放置预览：实线 + 随鼠标移动的两条垂直平行线段 + 尺寸线
        const off=rulerPreviewMouse ? clampOff(signedOffset(rulerA,rulerB,rulerPreviewMouse)/mag) : 0;
        const ax=o.ox+rulerA.gx*gs.w/GRID_W, ay=o.oy+rulerA.gy*gs.h/GRID_H;
        const bx=o.ox+rulerB.gx*gs.w/GRID_W, by=o.oy+rulerB.gy*gs.h/GRID_H;
        drawDim(ctx,rulerA,rulerB,ax,ay,bx,by,off,gs.w/GRID_W,0.7);
      }else if(rulerA){
        const ax=o.ox+rulerA.gx*gs.w/GRID_W;
        const ay=o.oy+rulerA.gy*gs.h/GRID_H;
        ctx.fillStyle='#00c853';
        ctx.beginPath(); ctx.arc(ax,ay,4,0,Math.PI*2); ctx.fill();
      }
      const hi = rulerMenuIndex>=0 ? rulerMenuIndex : (tool==='ruler' ? rulerHoverIndex : -1);
      if(hi>=0 && rulers[hi]){
        const r=rulers[hi];
        const ax=o.ox+r.a.gx*gs.w/GRID_W, ay=o.oy+r.a.gy*gs.h/GRID_H;
        const bx=o.ox+r.b.gx*gs.w/GRID_W, by=o.oy+r.b.gy*gs.h/GRID_H;
        const rad=14;
        ctx.strokeStyle='rgba(0,0,0,0.28)';
        ctx.lineWidth=1.5;
        ctx.setLineDash([6,4]);
        if(rulerMenuIndex<0 && (rulerHoverPart==='a'||rulerHoverPart==='b')){
          // 选中测量点：以该点为圆心画完整小圆
          const px=rulerHoverPart==='a'?ax:bx;
          const py=rulerHoverPart==='a'?ay:by;
          ctx.beginPath();
          ctx.arc(px,py,rad,0,Math.PI*2);
          ctx.stroke();
        }else if(rulerMenuIndex<0 && (rulerHoverPart==='lineA'||rulerHoverPart==='lineB')){
          // 选中可调节的平行直线（尺寸界线）：高亮整条线
          const ang=Math.atan2(by-ay, bx-ax);
          const nx=-Math.sin(ang), ny=Math.cos(ang);
          const offPx=r.off*mag;
          const sgn=offPx>=0?1:-1;
          const cxp=rulerHoverPart==='lineA'?ax:bx;
          const cyp=rulerHoverPart==='lineA'?ay:by;
          ctx.strokeStyle='rgba(0,200,83,0.9)';
          ctx.lineWidth=3;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(cxp-nx*14*mag*sgn, cyp-ny*14*mag*sgn);
          ctx.lineTo(cxp+nx*(offPx+12*mag*sgn), cyp+ny*(offPx+12*mag*sgn));
          ctx.stroke();
        }else{
          // 选中整条标注：两端小半圆 + 平行直虚线（胶囊形）
          const ang=Math.atan2(by-ay, bx-ax);
          const nx=-Math.sin(ang), ny=Math.cos(ang);
          ctx.beginPath();
          ctx.moveTo(ax+nx*rad, ay+ny*rad);
          ctx.lineTo(bx+nx*rad, by+ny*rad);
          ctx.moveTo(ax-nx*rad, ay-ny*rad);
          ctx.lineTo(bx-nx*rad, by-ny*rad);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(ax,ay,rad, ang+Math.PI/2, ang+Math.PI*3/2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(bx,by,rad, ang-Math.PI/2, ang+Math.PI/2);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      for(const r of rulers){
        const ax=o.ox+r.a.gx*gs.w/GRID_W, ay=o.oy+r.a.gy*gs.h/GRID_H;
        const bx=o.ox+r.b.gx*gs.w/GRID_W, by=o.oy+r.b.gy*gs.h/GRID_H;
        drawDim(ctx,r.a,r.b,ax,ay,bx,by,r.off,gs.w/GRID_W,1);
      }
    }
    if(exportRectMode&&exportRect){
      const s=rectScreen(exportRect);
      ctx.fillStyle='rgba(59,130,246,0.15)';
      ctx.fillRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0);
      ctx.strokeStyle='rgba(59,130,246,0.9)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0);
      ctx.setLineDash([]);
      ctx.fillStyle='#fff';
      ctx.strokeStyle='#3b82f6';
      ctx.lineWidth=2;
      const hs=6;
      const pts=[[s.x0,s.y0],[s.x1,s.y0],[s.x1,s.y1],[s.x0,s.y1],
                 [(s.x0+s.x1)/2,s.y0],[(s.x0+s.x1)/2,s.y1],[s.x0,(s.y0+s.y1)/2],[s.x1,(s.y0+s.y1)/2]];
      for(const p of pts){
        ctx.beginPath();
        ctx.rect(p[0]-hs/2, p[1]-hs/2, hs, hs);
        ctx.fill();
        ctx.stroke();
      }
    }else if(exportRectMode&&exportCorner&&exportCornerCur){
      // 两次点击角点期间：从第 1 个角点到当前鼠标的虚线预览
      const p0=exportCorner, p1=exportCornerCur;
      const pr=rectScreen({x0:Math.min(p0.gx,p1.gx), y0:Math.min(p0.gy,p1.gy),
                           x1:Math.max(p0.gx,p1.gx), y1:Math.max(p0.gy,p1.gy)});
      ctx.fillStyle='rgba(59,130,246,0.15)';
      ctx.fillRect(pr.x0,pr.y0,pr.x1-pr.x0,pr.y1-pr.y0);
      ctx.strokeStyle='rgba(59,130,246,0.9)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(pr.x0,pr.y0,pr.x1-pr.x0,pr.y1-pr.y0);
      ctx.setLineDash([]);
    }
    if(lassoDrawing && lassoPts.length>1){
      ctx.strokeStyle='rgba(60,130,255,0.95)';
      ctx.lineWidth=2;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      for(let i=0;i<lassoPts.length;i++){
        const lx=o.ox+lassoPts[i][0]*gs.w/GRID_W;
        const ly=o.oy+lassoPts[i][1]*gs.h/GRID_H;
        if(i===0) ctx.moveTo(lx,ly); else ctx.lineTo(lx,ly);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if(symmetry!=='off'){
      ctx.lineWidth=tool==='sym'?2.5:1.5;          // 编辑模式下加粗提示可拖动
      ctx.strokeStyle='rgba(220,60,60,0.9)';
      ctx.setLineDash([6,4]);
      if(symmetry==='v'||symmetry==='vh'){
        const ax=o.ox+symX*gs.w/GRID_W;
        ctx.beginPath(); ctx.moveTo(ax,o.oy); ctx.lineTo(ax,o.oy+gs.h); ctx.stroke();
      }
      if(symmetry==='h'||symmetry==='vh'){
        const ay=o.oy+symY*gs.h/GRID_H;
        ctx.beginPath(); ctx.moveTo(o.ox,ay); ctx.lineTo(o.ox+gs.w,ay); ctx.stroke();
      }
      if(symmetry==='d45'||symmetry==='dx'){         // 45° 主对角线（过画布中心，固定不拖动）
        ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(o.ox,o.oy); ctx.lineTo(o.ox+gs.w,o.oy+gs.h); ctx.stroke();
      }
      if(symmetry==='d135'||symmetry==='dx'){        // 135° 反对角线
        ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(o.ox+gs.w,o.oy); ctx.lineTo(o.ox,o.oy+gs.h); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    updateCodeCount();
    updateSizeLock();
  }

  // ---- 当前颜色 ----
  let curColor = '#000000';
  const colorInput=document.getElementById('colorInput');
  const hexText=document.getElementById('hexText');
  function parseHex(hex){
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
  }
  function toHex(r,g,b){
    return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }
  let customSwatch=null, customHex='#ff0000';
  function setCurColor(hex){
    curColor=hex;
    colorInput.value=hex;
    hexText.value=hex.toUpperCase();
    document.querySelectorAll('.palette .swatch').forEach(s=>{
      s.classList.toggle('active', s.dataset.color===hex.toLowerCase());
    });
    if(customSwatch){
      customSwatch.classList.toggle('active', hex.toLowerCase()===customHex.toLowerCase());
    }
  }
  // 从调色盘/历史取色/拼豆色卡选色：设色并记录，有选区时替换选区；
  // 橡皮状态下选色后自动切回画笔（先填色再切换，避免清掉刚用的选区）
  function pickColor(hex){
    setCurColor(hex);
    addHistory(hex);
    fillSelectionColor(hex);
    if(tool==='eraser') setTool('pen');
  }
  colorInput.addEventListener('input',()=>{
    setCurColor(colorInput.value);   // 拖动取色只实时预览，不写入历史
  });
  hexText.addEventListener('change',()=>{
    const v=hexText.value.trim();
    if(/^#?[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(v)){
      const hex=v.startsWith('#')?v:'#'+v;
      setCurColor(hex);              // 手动输入也只预览，点「确定」才写入历史
    }else{
      setCurColor(curColor);
    }
  });
  document.getElementById('colorConfirm').addEventListener('click',()=>{
    pickColor(curColor);   // 确认：写入历史 + 有选区则替换 + 橡皮状态切回画笔
  });

  // ---- 历史取色记录（最多 12 个，新色在最前） ----
  const HISTORY_MAX=12;
  let history=[];
  const historyEl=document.getElementById('history');
  function addHistory(hex){
    hex=hex.toLowerCase();
    const i=history.indexOf(hex);
    if(i>-1) history.splice(i,1);
    history.unshift(hex);
    if(history.length>HISTORY_MAX) history.pop();
    renderHistory();
  }
  function renderHistory(){
    historyEl.innerHTML='';
    for(let k=0;k<HISTORY_MAX;k++){
      const el=document.createElement('button');
      el.className='h-swatch'+(history[k]?'':' empty');
      if(history[k]){
        el.style.background=history[k];
        el.title=history[k];
        el.addEventListener('click',()=>{
          pickColor(history[k]);
        });
      }
      historyEl.appendChild(el);
    }
  }
  renderHistory();

  // ---- 调色盘 ----
  const palette=[
    '#000000','#ffffff','#888888','#bdbdbd','#555555',
    '#e74c3c','#ff9800','#ffeb3b','#4caf50','#00bcd4',
    '#2196f3','#3f51b5','#9c27b0','#e91e63','#795548',

const MARD_COLORS=[

  // ---- 拼豆色卡预览窗口（多品牌） ----
  const beadPanel=document.getElementById('beadPanel');
  const beadPanelBody=document.getElementById('beadPanelBody');
  const MARD_SERIES=['A','B','C','D','E','F','G','H','M','P','Q','R','Y','ZG'];
  function renderBeadChart(colors, allowed, enabledSet){
    const groups={};
    const order=[];
    for(const [code,hex] of colors){
      const m=code.match(/^[A-Za-z]+/);
      const series=m?m[0].toUpperCase():'';
      if(allowed && allowed.indexOf(series)===-1) continue;
      if(!groups[series]) order.push(series);
      (groups[series]=groups[series]||[]).push([code,hex]);
    }
    let html='<div class="bead-overview">▸ 全部展开</div>';
    for(const series of order){
      const list=groups[series];
      html+='<div class="bead-series collapsed"><div class="bead-series-title">'+series+' 系列（'+list.length+'）</div><div class="bead-series-grid">';
      for(const [code,hex] of list){
        // 子集筛选：不在选中子集内的颜色灰色置灰、不可选中（含下方标注的序号）
        const dis=enabledSet&&!enabledSet.has(code);
        html+='<div class="bead-color-cell"><button class="bead-color'+(dis?' disabled':'')+'" data-hex="'+hex+'" title="'+code+' '+hex+'" style="background:'+hex+'"></button><span class="bead-code'+(dis?' disabled':'')+'">'+code+'</span></div>';
      }
      html+='</div></div>';
    }
    return html;
  }
  function beadContentHTML(brand, enabledSet){
    if(brand==='mard') return renderBeadChart(MARD_COLORS, MARD_SERIES, enabledSet);
    if(brand==='coco') return renderBeadChart(COCO_COLORS, null, enabledSet);
    const ci=importedCardIndex(brand);
    if(ci>=0) return renderBeadChart(importedCards[ci].colors, null, enabledSet);
    return '<p class="bead-empty">该色卡数据待补充</p>';
  }
  let activeBrand=null;
  const beadBrandNames={mard:'MARD色卡', coco:'COCO色卡'};
  function showBeadPanel(brand){
    activeBrand=brand;
    document.querySelectorAll('.bead-title').forEach(el=>{
      el.classList.toggle('active', el.dataset.brand===brand);
    });
    beadPanel.style.display='flex';
    document.getElementById('beadPanelHead').textContent=beadBrandName(brand);
    // 子集下拉：对应「匹配色卡」中的各色卡子集；不在所选子集内的颜色灰色置灰、不可选中
    const sel=document.getElementById('beadSubsetSelect');
    const card=cardById(brand);
    let opts='<option value="">全色</option>';
    if(card&&card.subsets) opts+=card.subsets.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('');
    sel.innerHTML=opts;
    sel.value='';
    const renderBody=()=>{
      let enabledSet=null;
      if(sel.value){
        const s=cardById(sel.value);
        if(s&&s.colors) enabledSet=new Set(s.colors.map(function(c){return c[0];}));
      }
      beadPanelBody.innerHTML=beadContentHTML(brand, enabledSet);
      beadPanelBody.querySelectorAll('.bead-color').forEach(el=>{
        if(el.classList.contains('disabled')) return;   // 子集外颜色不可选中
        el.addEventListener('click',()=>{
          pickColor(el.dataset.hex);
        });
      });
      const updateOverview=()=>{
        const ov=beadPanelBody.querySelector('.bead-overview');
        if(!ov) return;
        const allCollapsed=[].every.call(beadPanelBody.querySelectorAll('.bead-series'), el=>el.classList.contains('collapsed'));
        ov.textContent=allCollapsed?'▸ 全部展开':'▾ 全部收起';
      };
      beadPanelBody.querySelectorAll('.bead-series-title').forEach(t=>{
        t.addEventListener('click',()=>{
          t.parentElement.classList.toggle('collapsed');
          updateOverview();
        });
      });
      const ov=beadPanelBody.querySelector('.bead-overview');
      if(ov){
        ov.addEventListener('click',()=>{
          const series=beadPanelBody.querySelectorAll('.bead-series');
          const allCollapsed=[].every.call(series, el=>el.classList.contains('collapsed'));
          series.forEach(el=>el.classList.toggle('collapsed', !allCollapsed));
          updateOverview();
        });
      }
    };
    sel.onchange=renderBody;
    renderBody();
  }
  function hideBeadPanel(){
    activeBrand=null;
    beadPanel.style.display='none';
    document.querySelectorAll('.bead-title').forEach(el=>el.classList.remove('active'));
  }
  document.querySelectorAll('.bead-title').forEach(el=>{
    el.addEventListener('click',()=>{
      const brand=el.dataset.brand;
      if(activeBrand===brand) hideBeadPanel();
      else showBeadPanel(brand);
    });
  });
  const beadCodeToggle=document.getElementById('beadCodeToggle');
  beadCodeToggle.addEventListener('click',()=>{
    beadPanelBody.classList.toggle('hide-codes');

  });
  document.getElementById('beadCloseBtn').addEventListener('click',hideBeadPanel);

  function importedCardIndex(id){
    for(let i=0;i<importedCards.length;i++) if(importedCards[i].id===id) return i;
    return -1;
  }
  function beadBrandName(brand){
    if(beadBrandNames[brand]) return beadBrandNames[brand];
    const ci=importedCardIndex(brand);
    return ci>=0?importedCards[ci].name:'拼豆色卡';
  }
  function parseCardText(text){
    const lines=String(text).split(/\r?\n/);
    const seen={};
    const colors=[];
    for(let i=0;i<lines.length;i++){
      const s=lines[i].trim();
      if(!s) continue;
      if(s.charAt(0)==='#') continue;          // 整行注释
      if(s.indexOf('//')===0) continue;        // 整行注释
      const m=s.match(/^(\S+?)\s*[,，:：\s]\s*(#?[0-9a-fA-F]{6})\s*$/);
      if(!m) continue;
      let hex=m[2];
      if(hex.charAt(0)!=='#') hex='#'+hex;
      hex=hex.toUpperCase();
      if(!seen[m[1]]){ seen[m[1]]=true; colors.push([m[1],hex]); }
    }
    return colors;
  }
  function cardNameFromFilename(name){
    let base=String(name||'');
    base=base.replace(/\.[^./\\]+$/,'');                // 去掉扩展名
    base=base.replace(/[-_](?:color|colors|色卡)$/i,''); // 去掉常见后缀
    base=base.replace(/[-_]+/g,' ').trim();
    if(!/色卡/.test(base)) base+='色卡';
    return base||'导入色卡';
  }
  function cardIdFromFilename(name){
    const base=String(name||'card').replace(/\.[^./\\]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    return 'imp-'+(base||'card');
  }
  function addImportedCard(id,name,colors,silent){
    const card={id:id,name:name,colors:colors,subsets:[{id:id+'-full',name:colors.length+'全色',colors:colors}]};
    let idx=-1;
    for(let i=0;i<MATCH_CARDS.length;i++){ if(MATCH_CARDS[i].id===id){ idx=i; break; } }
    if(idx>=0) MATCH_CARDS[idx]=card; else MATCH_CARDS.push(card);
    const ci=importedCardIndex(id);
    if(ci>=0) importedCards[ci]=card; else importedCards.push(card);
    saveImportedCards();
    rebuildBeadBrands();
    if(matchPopup && matchPopup.style.display==='block') renderMatchPopup();
    if(!silent) statusEl.textContent='已导入色卡「'+name+'」共 '+colors.length+' 色';
  }
  function saveImportedCards(){
    try{ localStorage.setItem(CARD_STORAGE_KEY, JSON.stringify(importedCards)); }catch(e){}
  }
  function loadImportedCards(){
    let data=null;
    try{ data=JSON.parse(localStorage.getItem(CARD_STORAGE_KEY)||'null'); }catch(e){}
    if(!Array.isArray(data)) return;
    for(let i=0;i<data.length;i++){
      const c=data[i];
      if(c && c.id && Array.isArray(c.colors) && c.colors.length){
        addImportedCard(c.id, c.name||c.id, c.colors, true);
      }
    }
  }

  function importCardFile(file){
    const reader=new FileReader();
    reader.onload=function(){
      const colors=parseCardText(reader.result);
      if(!colors.length){
        alert('未解析到有效色卡条目。格式：每行「编号,#RRGGBB」（#可省略，编号与色值间可用英文逗号、中文逗号、冒号或空格分隔）');

      addImportedCard(cardIdFromFilename(file.name), cardNameFromFilename(file.name), colors);

  // ---- 工具 ----
  let tool='pen';
  let selColorMode=false;   // 同色选择模式（可与套索组合：点击套索后套索与同色同时高亮）
  // 对称轴：'off' 关 / 'v' 左右垂直 / 'h' 上下水平 / 'vh' 双轴 / 'd45' 'd135' 'dx' 斜向（持久模式，可与套索选区组合使用；点按钮开启默认左右，再点关闭）
  let symmetry='off';

  function setTool(t){

    }
    // 切换到画笔/橡皮/取色/填充/同色选择/标尺等工具时，自动取消套索选中的区域

  // 关闭对称轴：置 off + 复位轴线到中央 + 收起选项行 + 刷新高亮

  document.querySelectorAll('.tools button').forEach(btn=>{

      if(t==='selcolor'){

      if(t==='sym'){

        return;
      }
      // 同色模式下的套索：有同色选中才进入组合模式；
      // 组合模式下再点套索则取消套索，只保留同色选中状态
      if(t==='lasso'){
        if(selColorMode){
          if(tool==='lasso'){
            tool='selcolor';
            updateToolHighlight();
            document.getElementById('selectRow').classList.toggle('show', false);
            statusEl.textContent='已退出套索，保留同色选择';
          }else if(!(selectionMask && countSel()>0)){
            // 同色模式但未选中画布颜色：取消同色模式，直接切到套索
            selColorMode=false;
            setTool('lasso');
          }else{
            // 有同色选中：进入同色+套索组合

        }else if(tool==='lasso'){
          // 单独套索：再次点击取消选中

          statusEl.textContent='已取消选择';
        }else{
          setTool('lasso');
        }
        return;
      }
      // 同色模式下点击橡皮：擦除选中的颜色并取消同色选中状态
      if(selColorMode && t==='eraser'){
        if(selectionMask && countSel()>0){
          const before=snapshot();
          for(let i=0;i<selectionMask.length;i++){
            if(selectionMask[i]) setCell(i%GRID_W, Math.floor(i/GRID_W), 255,255,255,true);
          }
          if(!samePixels(before.pixels,pixels)) pushUndo(before);

      }
      // 已选中的工具再次点击：解除选中（进入无工具状态）
      if(t===tool){
        setTool('none');
        statusEl.textContent='已取消选择';
        return;

    });
  });

  function evToCell(e){
    const rect=canvas.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(canvas.width/rect.width);
    const py=(e.clientY-rect.top)*(canvas.height/rect.height);
    const o=gridOffsets();
    const gs=gridSize();
    const gx=(px-o.ox)/gs.w*GRID_W;
    const gy=(py-o.oy)/gs.h*GRID_H;
    if(gx<0||gy<0||gx>=GRID_W||gy>=GRID_H) return null;
    return [Math.floor(gx),Math.floor(gy)];
  }
  function updateStatus(cx,cy){
    const c=getCell(cx,cy);
    statusEl.textContent = c[3]===0
      ? '单元格 ('+cx+', '+cy+') · 空色块'
      : '单元格 ('+cx+', '+cy+') · RGB('+c[0]+','+c[1]+','+c[2]+') · '+toHex(c[0],c[1],c[2]);
  }

  // ---- 填充（洪水填充）----
  function floodFill(x,y){
    const target=getCell(x,y);
    const fill=parseHex(curColor);
    // 按 RGBA 比较：空格(alpha 0) 与白珠(alpha 255) 是不同目标，不互相串色；
    // 填充始终写入不透明色（alpha 255），所以“填充白色于空格”会把空格涂成白珠
    if(target[0]===fill.r&&target[1]===fill.g&&target[2]===fill.b&&target[3]===255) return;
    const visited=new Uint8Array(GRID_W*GRID_H);
    const stack=[[x,y]];
    while(stack.length){
      const [px,py]=stack.pop();
      const idx=py*GRID_W+px;
      if(visited[idx]) continue;
      visited[idx]=1;
      if(!cellEq(px,py,target[0],target[1],target[2],target[3])) continue;
      setCell(px,py,fill.r,fill.g,fill.b);
      if(px>0) stack.push([px-1,py]);
      if(px<GRID_W-1) stack.push([px+1,py]);
      if(py>0) stack.push([px,py-1]);
      if(py<GRID_H-1) stack.push([px,py+1]);
    }
  }

  // ---- 套索选区 ----
  let selectionMask=null;
  let selUniverse=null;   // 同色选择的集合（同色+套索状态下反选用的全集）
  let lassoRegion=null;   // 套索区域（同色+套索状态下反选用的补集区域）
  let lassoPts=[];
  let lassoDrawing=false;
  const selCanvas=document.createElement('canvas');
  const selCtx=selCanvas.getContext('2d');
  function initSelectionCanvas(){
    selCanvas.width=GRID_W;
    selCanvas.height=GRID_H;
    selCtx.clearRect(0,0,GRID_W,GRID_H);
    selectionMask=null;
    selUniverse=null;
    lassoRegion=null;
  }
  function drawSelectionOverlay(){
    selCtx.clearRect(0,0,GRID_W,GRID_H);
    if(!selectionMask) return;
    const img=selCtx.getImageData(0,0,GRID_W,GRID_H);
    const d=img.data;
    for(let i=0;i<GRID_W*GRID_H;i++){
      if(selectionMask[i]){
        const j=i*4;
        d[j]=80; d[j+1]=150; d[j+2]=255; d[j+3]=110;
      }
    }
    selCtx.putImageData(img,0,0);
  }
  function countSel(){
    if(!selectionMask) return 0;
    let n=0;
    for(let i=0;i<selectionMask.length;i++) if(selectionMask[i]) n++;
    return n;
  }
  function pointInPoly(x,y,pts){
    let inside=false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
      if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
  }
  function finalizeLasso(){
    lassoDrawing=false;
    if(lassoPts.length<3){
      lassoPts=[];
      render();
      return;
    }
    const pts=lassoPts;
    const hasPrior=selectionMask && countSel()>0;
    const priorFromLasso=!!lassoRegion;   // 上次选区是否由套索框选产生
    lassoRegion=new Uint8Array(GRID_W*GRID_H);
    for(let y=0;y<GRID_H;y++){
      for(let x=0;x<GRID_W;x++){
        if(pointInPoly(x+0.5,y+0.5,pts)) lassoRegion[y*GRID_W+x]=1;
      }
    }
    // 对称轴开启：选区与其镜像求并集（套索跨轴线 → 两侧同时选中）
    if(symmetry!=='off'){
      const sym=new Uint8Array(GRID_W*GRID_H);
      for(let i=0;i<lassoRegion.length;i++){
        if(lassoRegion[i]){
          const x=i%GRID_W, y=Math.floor(i/GRID_W);
          for(const c of symCells(x,y)) sym[c[1]*GRID_W+c[0]]=1;
        }
      }
      lassoRegion.set(sym);
    }
    if(hasPrior && !priorFromLasso){
      // 之前的选区来自同色选择：保留同色与套索区域的交集
      for(let y=0;y<GRID_H;y++){
        for(let x=0;x<GRID_W;x++){
          if(selectionMask[y*GRID_W+x] && !lassoRegion[y*GRID_W+x]) selectionMask[y*GRID_W+x]=0;
        }
      }
    }else{
      // 无选区，或上次选区由套索产生：先取消已选中区域，再选中新的框选区域
      if(!selectionMask) selectionMask=new Uint8Array(GRID_W*GRID_H);
      else selectionMask.fill(0);
      selectionMask.set(lassoRegion);
      selUniverse=null;
    }
    lassoPts=[];
    drawSelectionOverlay();
    render();
    statusEl.textContent=(hasPrior&&!priorFromLasso)
      ? '与套索求交集，当前选中 '+countSel()+' 个像素'
      : '已选中 '+countSel()+' 个像素';
  }
  function invertSelection(){
    if(!selectionMask){
      alert('请先用套索选择一个区域，再执行反选');
      return;
    }
    if(selUniverse && lassoRegion){
      // 同色+套索：全集为同色选中集合，反选得到其中套索选中的补集
      for(let i=0;i<selectionMask.length;i++){
        selectionMask[i]=selUniverse[i]&&!selectionMask[i]?1:0;
      }
      drawSelectionOverlay();
      render();
      statusEl.textContent='已反选（同色+套索补集），当前选中 '+countSel()+' 个像素';
      return;
    }
    for(let i=0;i<selectionMask.length;i++) selectionMask[i]=selectionMask[i]?0:1;
    drawSelectionOverlay();
    render();
    statusEl.textContent='已反选，当前选中 '+countSel()+' 个像素';
  }
  function clearSelection(){
    selectionMask=null;
    selUniverse=null;
    lassoRegion=null;
    drawSelectionOverlay();
    render();
    statusEl.textContent='已清除选区';
  }
  function deleteSelection(){
    if(!selectionMask || countSel()===0){
      alert('请先用套索选择一个区域，再执行删除');
      return;
    }
    const before=snapshot();
    for(let i=0;i<selectionMask.length;i++){
      if(selectionMask[i]) setCell(i%GRID_W, Math.floor(i/GRID_W), 255,255,255,true);
    }
    if(!samePixels(before.pixels,pixels)){ pushUndo(before); markEdited(); }
    drawSelectionOverlay();
    render();
    statusEl.textContent='已删除选中区域的 '+countSel()+' 个像素';
  }
  function fillSelectionColor(hex){
    // 单击调色盘/历史取色/拼豆色卡颜色：有选区时直接替换选区。
    // 已匹配过色卡（匹配模式）时，把替换颜色吸附到最近色卡颜色（含白色→卡内白色），使像素与编号一致；
    // 手动写像素与编号，便于对“像素未变但编号变化”的情况也记录撤销。
    if(!selectionMask || countSel()===0) return;
    let c=parseHex(hex);
    let matched=null;
    if(matchedPalette){
      const nc=nearestCardColor(matchedPalette,c.r,c.g,c.b);
      matched=nc;
      c={r:nc.r,g:nc.g,b:nc.b};
    }
    const before=snapshot();
    let anyChange=false;
    for(let i=0;i<selectionMask.length;i++){
      if(!selectionMask[i]) continue;
      const x=i%GRID_W, y=Math.floor(i/GRID_W);
      const p=(y*GRID_W+x)*4;
      if(pixels[p]!==c.r||pixels[p+1]!==c.g||pixels[p+2]!==c.b||pixels[p+3]!==255) anyChange=true;
      pixels[p]=c.r;pixels[p+1]=c.g;pixels[p+2]=c.b;pixels[p+3]=255;
      const idx=matched?matched._idx:NO_CODE;
      if(cellCodeIdx){
        if(cellCodeIdx[y*GRID_W+x]!==idx) anyChange=true;
        cellCodeIdx[y*GRID_W+x]=idx;
      }
    }
    if(anyChange){ pushUndo(before); markEdited(); }
    drawSelectionOverlay();
    render();
    statusEl.textContent=matched
      ? '已用 '+hex+' 替换选区，匹配色卡 '+matched.code+'（'+matched.hex+'）'
      : '已用 '+hex+' 替换选区 '+countSel()+' 个像素';
  }
  document.getElementById('invertSelBtn').addEventListener('click',invertSelection);
  document.getElementById('clearSelBtn').addEventListener('click',clearSelection);
  document.getElementById('deleteSelBtn').addEventListener('click',deleteSelection);
  function evToGridF(e){
    const rect=canvas.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(canvas.width/rect.width);
    const py=(e.clientY-rect.top)*(canvas.height/rect.height);
    const o=gridOffsets();
    const gs=gridSize();
    return {gx:(px-o.ox)/gs.w*GRID_W, gy:(py-o.oy)/gs.h*GRID_H};
  }

  // ---- 标尺：每格边长对应现实 2.6mm ----
  const MM_PER_CELL=2.6;
  let rulerA=null;            // 测量第一点 {gx,gy}
  let rulerB=null;            // 测量第二点 {gx,gy}
  let rulerPlacing=false;     // 两点已定，等待第三次点击确认标注偏移量
  let rulerPreviewMouse=null; // 放置预览时的鼠标位置（网格坐标，浮点）
  let rulers=[];              // 已完成的测量 [{a,b,off}]
  let rulerDrag=null;         // 拖动中的标尺 {index,mode,end,origA,origB,start,px,py}
  let rulerMenuIndex=-1;
  let rulerHoverIndex=-1;     // 鼠标悬停的标尺索引
  let rulerHoverPart=null;    // 悬停部位：'line' | 'a' | 'b' | null
  const rulerPopupEl=document.getElementById('rulerPopup');
  const symRowEl=document.getElementById('symRow');
  function signedOffset(a,b,m){
    const o=gridOffsets(), gs=gridSize();
    const ax=o.ox+a.gx*gs.w/GRID_W, ay=o.oy+a.gy*gs.h/GRID_H;
    const bx=o.ox+b.gx*gs.w/GRID_W, by=o.oy+b.gy*gs.h/GRID_H;
    const mx=o.ox+m.gx*gs.w/GRID_W, my=o.oy+m.gy*gs.h/GRID_H;
    const ddx=bx-ax, ddy=by-ay;
    const len=Math.hypot(ddx,ddy);
    if(len<0.01) return 16;
    return ((my-ay)*ddx-(mx-ax)*ddy)/len;
  }
  function clampOff(off){
    return Math.abs(off)<12 ? (off>=0?12:-12) : off;
  }
  function cancelRulerPlace(){
    rulerA=null; rulerB=null; rulerPlacing=false; rulerPreviewMouse=null;
  }
  function commitRuler(e){
    const off=clampOff(signedOffset(rulerA,rulerB,evToGridF(e))/mag);
    rulers.push({a:rulerA, b:rulerB, off:off});
    const m=rulerMeasure(rulerA,rulerB);
    const s=m.mm>30 ? (m.mm/10).toFixed(2)+' cm' : m.mm.toFixed(2)+' mm';
    statusEl.textContent='标尺：'+fmtCells(m.cells)+' 格  '+s;
    rulerA=null; rulerB=null; rulerPlacing=false; rulerPreviewMouse=null;
    render();
    scheduleAutoSave();
  }
  function rulerMeasure(a,b){
    const cells=Math.hypot(b.gx-a.gx, b.gy-a.gy);
    const mm=cells*MM_PER_CELL;
    return {cells, mm};
  }
  // 格数显示：整数显示整数，小数保留一位
  function fmtCells(cells){
    return Number.isInteger(cells) ? String(cells) : cells.toFixed(1);
  }
  function rulerPoint(g){
    const x=Math.min(GRID_W,Math.max(0,Math.round(g.gx)));
    const y=Math.min(GRID_H,Math.max(0,Math.round(g.gy)));
    return {gx:x, gy:y};
  }
  function clampAxis(v,max){ return Math.min(max,Math.max(0,v)); }
  // 对称轴吸附：0.5 网格步进（整数=格线，半整数=格中），并钳制在板内 [0.5, max-0.5]
  function snapAxis(v,max){ return Math.min(max-0.5,Math.max(0.5,Math.round(v*2)/2)); }
  function distToSeg(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2=dx*dx+dy*dy;
    let t=len2?((px-x1)*dx+(py-y1)*dy)/len2:0;
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }
  function hitTestRuler(e){
    const rect=canvas.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(canvas.width/rect.width);
    const py=(e.clientY-rect.top)*(canvas.height/rect.height);
    const o=gridOffsets(), gs=gridSize();
    for(let i=rulers.length-1;i>=0;i--){
      const r=rulers[i];
      const ax=o.ox+r.a.gx*gs.w/GRID_W, ay=o.oy+r.a.gy*gs.h/GRID_H;
      const bx=o.ox+r.b.gx*gs.w/GRID_W, by=o.oy+r.b.gy*gs.h/GRID_H;
      if(Math.hypot(px-ax,py-ay)<10) return {index:i, part:'a'};
      if(Math.hypot(px-bx,py-by)<10) return {index:i, part:'b'};
      // 箭头尺寸线：随 off 偏移的平行线，命中后可拖动调节 off（改变两条尺寸界线长度）
      const ddx=bx-ax, ddy=by-ay;
      const len=Math.hypot(ddx,ddy);
      if(len>=0.01){
        const nx=-ddy/len, ny=ddx/len;
        const offPx=r.off*mag;
        const ex1=ax+nx*offPx, ey1=ay+ny*offPx;
        const ex2=bx+nx*offPx, ey2=by+ny*offPx;
        if(distToSeg(px,py,ex1,ey1,ex2,ey2)<7) return {index:i, part:'dim'};
        // 两条平行直线（过两端点、垂直 a-b 的尺寸界线）：命中后拖动可改变标尺长度
        const sgn=offPx>=0?1:-1;
        const extBase=14*mag, extTip=12*mag;
        if(distToSeg(px,py, ax-nx*extBase*sgn,ay-ny*extBase*sgn, ax+nx*(offPx+extTip*sgn),ay+ny*(offPx+extTip*sgn))<8) return {index:i, part:'lineA'};
        if(distToSeg(px,py, bx-nx*extBase*sgn,by-ny*extBase*sgn, bx+nx*(offPx+extTip*sgn),by+ny*(offPx+extTip*sgn))<8) return {index:i, part:'lineB'};
      }
      if(distToSeg(px,py,ax,ay,bx,by)<7) return {index:i, part:'line'};
    }
    return null;
  }
  function drawArrow(c,px,py,ux,uy,len,hw){
    const npx=-uy, npy=ux;
    c.beginPath();
    c.moveTo(px,py);
    c.lineTo(px+ux*len+npx*hw, py+uy*len+npy*hw);
    c.lineTo(px+ux*len-npx*hw, py+uy*len-npy*hw);
    c.closePath();
    c.fill();
  }
  function drawDim(c, a, b, ax,ay, bx,by, offFit, cellPx, alpha){
    const ddx=bx-ax, ddy=by-ay;
    const len=Math.hypot(ddx,ddy);
    if(len<0.01) return;
    // 标注随格栅等比例缩放：s = 当前单元格像素 / 适配视图单元格像素，off 存的是适配视图像素
    const s=Math.max(0.05, cellPx/fitCell);
    const off=offFit*s;
    const col='#00c853';
    const ux=ddx/len, uy=ddy/len;
    const nx=-uy, ny=ux;
    const ex1=ax+nx*off, ey1=ay+ny*off;
    const ex2=bx+nx*off, ey2=by+ny*off;
    // 单色线段绘制
    function seg(x1,y1,x2,y2,w){
      c.strokeStyle=col; c.lineWidth=w*s;
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    }
    // 实线：连接两测量点（不透明）
    seg(ax,ay,bx,by,3);
    // 尺寸界线（两平行线段）：与标注同色，两端各超出一点（测量点端要超过圆点可见）
    const extBase=14*s; // 测量点外侧伸出长度
    const extTip=12*s;  // 尺寸线外侧伸出长度
    const sgn=off>=0 ? 1 : -1;  // 尺寸线所在侧，保证两方向延伸一致
    seg(ax-nx*extBase*sgn, ay-ny*extBase*sgn, ex1+nx*extTip*sgn, ey1+ny*extTip*sgn, 2.5);
    seg(bx-nx*extBase*sgn, by-ny*extBase*sgn, ex2+nx*extTip*sgn, ey2+ny*extTip*sgn, 2.5);
    // 尺寸线/箭头/文字：预览时半透明
    c.save();
    if(alpha<1) c.globalAlpha=alpha;
    // 标注文字：mm→cm，格式 "xxcm[xx格]"
    const mtx=rulerMeasure(a,b);
    const cmTxt=String(parseFloat((mtx.mm/10).toFixed(2)))+'cm['+fmtCells(mtx.cells)+'格]';
    c.font='bold '+Math.max(5,Math.round(17*s))+'px sans-serif';
    const arrowLen=8*s;
    const mx=(ex1+ex2)/2, my=(ey1+ey2)/2;
    const w=c.measureText(cmTxt).width;
    const tooShort=len<w+16*s;
    // 完整双箭头实线：中间无间隔，两端指向内侧的箭头
    seg(ex1,ey1,ex2,ey2,3);
    c.fillStyle=col;
    drawArrow(c,ex1,ey1, ux,uy, arrowLen, 3.5*s);
    drawArrow(c,ex2,ey2, -ux,-uy, arrowLen, 3.5*s);
    // 测量点圆点
    c.fillStyle=col;
    c.beginPath(); c.arc(ax,ay,4*s,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(bx,by,4*s,0,Math.PI*2); c.fill();
    if(tooShort){
      // 过短：标注改到 b 端箭头直线后方一侧
      c.translate(ex2+ux*(arrowLen+6*s), ey2+uy*(arrowLen+6*s));
      c.rotate(Math.atan2(ddy,ddx));
      c.textAlign='left';
      c.textBaseline='middle';
      c.fillStyle=col;
      c.fillText(cmTxt, 0, 0);
    }else{
      // 标注位置：平行于双箭头实线，位于实线上方
      c.translate(mx,my);
      c.rotate(Math.atan2(ddy,ddx));
      c.textAlign='center';
      c.textBaseline='middle';
      c.fillStyle=col;
      c.fillText(cmTxt, 0, -12*s);
    }
    c.restore();
  }
  function openRulerMenu(index,x,y){
    rulerMenuIndex=index;
    rulerPopupEl.style.display='flex';
    const w=rulerPopupEl.offsetWidth, h=rulerPopupEl.offsetHeight;
    let lx=x+10, ly=y+10;
    if(lx+w>window.innerWidth-8) lx=x-w-10;
    if(ly+h>window.innerHeight-8) ly=y-h-10;
    rulerPopupEl.style.left=Math.max(4,lx)+'px';
    rulerPopupEl.style.top=Math.max(4,ly)+'px';
  }
  function closeRulerMenu(){
    rulerMenuIndex=-1;
    rulerPopupEl.style.display='none';
  }
  function clearRulers(){
    rulers.length=0;
    rulerA=null; rulerB=null; rulerPlacing=false; rulerPreviewMouse=null;
    rulerDrag=null;
    closeRulerMenu();
    rulerHoverIndex=-1; rulerHoverPart=null;
    scheduleAutoSave();
  }
  document.querySelectorAll('.ruler-popup button').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const act=b.dataset.rulerAction;
      if(act==='delete'){
        rulers.splice(rulerMenuIndex,1);
        closeRulerMenu();

      }
    });
  });
  document.querySelectorAll('#symRow button').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      // 复位轴线按钮：轴回到中央，保持当前对称模式
      if(b.dataset.symReset!==undefined){
        symX=GRID_W/2; symY=GRID_H/2;
        render();
        statusEl.textContent='对称轴：'+({v:'左右',h:'上下',vh:'双轴',d45:'45°斜向',d135:'135°斜向',dx:'双斜向'}[symmetry])+'（轴线已复位到中央）';
        return;
      }
      const m=b.dataset.sym;
      // 斜向对称轴仅支持正方形画布：非正方形时提示并拒绝切换
      if((m==='d45'||m==='d135'||m==='dx')&&GRID_W!==GRID_H){
        statusEl.textContent='斜向对称轴仅支持正方形画布（当前 '+GRID_W+'×'+GRID_H+'）';
        return;
      }
      symmetry=m;
      document.querySelectorAll('#symRow button').forEach(x=>x.classList.toggle('active',x===b));
      updateToolHighlight();
      render();
      statusEl.textContent='对称轴：'+({v:'左右',h:'上下',vh:'双轴',d45:'45°斜向',d135:'135°斜向',dx:'双斜向'}[symmetry])+'（画笔 / 橡皮镜像）';
    });
  });
  document.addEventListener('click',e=>{
    if(rulerPopupEl.style.display==='none'&&exportPopupEl.style.display==='none') return;
    if(rulerPopupEl.contains(e.target)||exportPopupEl.contains(e.target)||e.target===canvas) return;
    closeRulerMenu();
    closeExportPopup();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(rulerPlacing){ cancelRulerPlace(); render(); }
      closeRulerMenu();
      closeExportPopup();
      if(exportRectMode) cancelExportRect();
    }
  });

  // 对称轴命中检测：指针距轴线 ≤10px（画布像素）判定命中，命中的轴 'v'|'h'|null
  function hitSymAxis(e){
    const rect=canvas.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(canvas.width/rect.width);
    const py=(e.clientY-rect.top)*(canvas.height/rect.height);
    const o=gridOffsets(), gs=gridSize();
    let best=null, bestD=10;
    if(symmetry==='v'||symmetry==='vh'){
      const ax=o.ox+symX*gs.w/GRID_W;
      const d=Math.abs(px-ax);
      if(d<=bestD){ best='v'; bestD=d; }
    }
    if(symmetry==='h'||symmetry==='vh'){
      const ay=o.oy+symY*gs.h/GRID_H;
      const d=Math.abs(py-ay);
      if(d<=bestD) best='h';
    }
    return best;
  }

  // ---- 鼠标 / 触控交互 ----
  let painting=false;
  let panning=false;
  let lastX=0, lastY=0;
  let prevTool='pen';
  let strokeSnapshot=null;
  let spaceHeld=false;
  document.addEventListener('keydown',e=>{
    if(e.code!=='Space') return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    spaceHeld=true;
    canvas.style.cursor='grab';
    e.preventDefault();
  });
  document.addEventListener('keyup',e=>{
    if(e.code!=='Space') return;
    spaceHeld=false;
    canvas.style.cursor='';
  });
  canvas.addEventListener('mousedown',e=>{ if(e.button===1) e.preventDefault(); });
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',e=>{
    if(exportRectMode){
      if(e.button===0){
        if(!exportRect){
          // 两次点击确定两个对角顶点：第 1 次定角点，第 2 次定对角顶点并生成选区
          const g=evToGridF(e);
          const cx=clampCell(g.gx,GRID_W-1), cy=clampCell(g.gy,GRID_H-1);
          if(!exportCorner){
            exportCorner={gx:cx, gy:cy};
            exportCornerCur={gx:cx, gy:cy};
            statusEl.textContent='已定第 1 个角点，再单击对角顶点确定选区';
            render();
          }else{
            exportRect={x0:Math.min(exportCorner.gx,cx), y0:Math.min(exportCorner.gy,cy),
                        x1:Math.max(exportCorner.gx,cx), y1:Math.max(exportCorner.gy,cy)};
            exportCorner=null;
            exportCornerCur=null;
            canvas.setPointerCapture(e.pointerId);
            exportOkPos={x:e.clientX, y:e.clientY};
            showExportOkBtn();
            statusEl.textContent='拖动顶点或边调整选区，点击「确定导出」完成';
            render();
          }
        }else{
          const hit=exportHitTest(e);
          startExportDrag(e, hit?hit.type:'none', hit&&hit.type==='corner'?hit.corner:null);
          canvas.setPointerCapture(e.pointerId);
        }
      }
      return;
    }
    if(e.button===1||spaceHeld){
      panning=true;
      lastX=e.clientX; lastY=e.clientY;
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor='grabbing';
      return;
    }
    if(tool==='lasso'&&e.button===0){
      lassoPts=[];
      lassoDrawing=true;
      const g=evToGridF(e);
      lassoPts.push([g.gx,g.gy]);
      canvas.setPointerCapture(e.pointerId);
      render();
      return;
    }
    if(tool==='selcolor'&&e.button===0){
      const cell=evToCell(e);
      if(cell){
        const idx=cell[1]*GRID_W+cell[0];
        if(selectionMask && selectionMask[idx]){
          selectionMask[idx]=0;
          if(selUniverse) selUniverse[idx]=0;
          if(countSel()===0){
            selectionMask=null;
            selUniverse=null;
            lassoRegion=null;
          }
          drawSelectionOverlay();
          render();
          statusEl.textContent=selectionMask
            ? '已取消选中该色块，当前选中 '+countSel()+' 个像素'
            : '已取消选中该色块，选区已清除';
        }else{
          const c=getCell(cell[0],cell[1]);
          const r=c[0],g=c[1],b=c[2],a=c[3];
          if(!selectionMask) selectionMask=new Uint8Array(GRID_W*GRID_H);
          selectionMask.fill(0);
          let n=0;
          for(let y=0;y<GRID_H;y++){
            const base=y*GRID_W;
            for(let x=0;x<GRID_W;x++){
              const i=base*4+x*4;
              if(pixels[i]===r&&pixels[i+1]===g&&pixels[i+2]===b&&pixels[i+3]===a){
                selectionMask[base+x]=1;
                n++;
              }
            }
          }
          selUniverse=new Uint8Array(selectionMask);
          lassoRegion=null;
          drawSelectionOverlay();
          render();
          statusEl.textContent='已选中 '+n+' 个同色像素（RGB '+r+','+g+','+b+'）';
        }
      }
      return;
    }
    if(tool==='ruler'&&e.button===0){
      if(rulerPlacing){
        commitRuler(e);
        return;
      }
      closeRulerMenu();
      const hit=hitTestRuler(e);
      if(hit){
        cancelRulerPlace();
        const r=rulers[hit.index];
        const g=evToGridF(e);
        const dMode=hit.part==='line'?'translate':(hit.part==='dim'?'dim':(hit.part==='lineA'||hit.part==='lineB')?hit.part:'endpoint');
        rulerDrag={index:hit.index,
                   mode:dMode,
                   end:dMode==='endpoint'?hit.part:null,
                   origA:{gx:r.a.gx,gy:r.a.gy}, origB:{gx:r.b.gx,gy:r.b.gy},
                   start:{gx:g.gx,gy:g.gy}, px:e.clientX, py:e.clientY};
        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor='grabbing';
        return;
      }
      const g=rulerPoint(evToGridF(e));
      if(rulerA===null){
        rulerA=g;
      }else{
        rulerB=g;
        rulerPlacing=true;
        rulerPreviewMouse={gx:g.gx,gy:g.gy};
        statusEl.textContent='移动鼠标调整标注偏移量，点击确认';
      }
      render();
      return;
    }
    if(tool==='ruler'&&rulerPlacing&&e.button===2){
      cancelRulerPlace();
      render();
      return;
    }
    if(tool==='sym'&&e.button===0){
      const axis=hitSymAxis(e);
      if(axis){ symDragging=axis; canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing'; }
      return;
    }
    if(tool==='none') return;
    if(e.button===2){ prevTool=tool; tool='eraser'; }
    painting=true;
    canvas.setPointerCapture(e.pointerId);
    if(tool==='pen'||tool==='eraser') strokeSnapshot=snapshot();
    apply(e);
  });
  canvas.addEventListener('pointermove',e=>{
    if(exportRectMode){
      if(exportDrag){
        if(Math.hypot(e.clientX-exportDrag.startCX, e.clientY-exportDrag.startCY)>=4) exportDrag.moved=true;
        updateExportDrag(evToGridF(e));
        render();
      }else if(exportRect){
        const hit=exportHitTest(e);
        if(hit){
          if(hit.type==='corner') canvas.style.cursor=(hit.corner==='tl'||hit.corner==='br')?'nwse-resize':'nesw-resize';
          else if(hit.type==='n'||hit.type==='s') canvas.style.cursor='ns-resize';
          else if(hit.type==='w'||hit.type==='e') canvas.style.cursor='ew-resize';
          else if(hit.type==='inside') canvas.style.cursor='move';
        }else{
          canvas.style.cursor='crosshair';
        }
      }else if(exportCorner){
        const g=evToGridF(e);
        exportCornerCur={gx:clampCell(g.gx,GRID_W-1), gy:clampCell(g.gy,GRID_H-1)};
        render();
      }
      return;
    }
    if(panning){
      panBy(e.clientX-lastX, e.clientY-lastY);
      lastX=e.clientX; lastY=e.clientY;
      return;
    }
    if(rulerDrag){
      rulerHoverIndex=rulerDrag.index;
      rulerHoverPart=rulerDrag.mode==='translate'?'line':rulerDrag.mode==='dim'?'dim':(rulerDrag.mode==='lineA'||rulerDrag.mode==='lineB')?rulerDrag.mode:rulerDrag.end;
      const g=evToGridF(e);
      const dx=g.gx-rulerDrag.start.gx, dy=g.gy-rulerDrag.start.gy;
      const r=rulers[rulerDrag.index];
      if(rulerDrag.mode==='translate'){
        r.a={gx:clampAxis(Math.round(rulerDrag.origA.gx+dx),GRID_W), gy:clampAxis(Math.round(rulerDrag.origA.gy+dy),GRID_H)};
        r.b={gx:clampAxis(Math.round(rulerDrag.origB.gx+dx),GRID_W), gy:clampAxis(Math.round(rulerDrag.origB.gy+dy),GRID_H)};
      }else if(rulerDrag.mode==='dim'){
        // 拖动箭头尺寸线：取其到 a-b 连线的垂距作为新 off（平行分量不影响），改变两条尺寸界线长度
        r.off=clampOff(signedOffset(r.a, r.b, g)/mag);
      }else if(rulerDrag.mode==='lineA'||rulerDrag.mode==='lineB'){
        // 拖动两端点所在的平行直线：沿 a-b 方向平移（垂直分量忽略），只改变标尺长度
        const dux=rulerDrag.origB.gx-rulerDrag.origA.gx, duy=rulerDrag.origB.gy-rulerDrag.origA.gy;
        const dl=Math.hypot(dux,duy)||1;
        const ux=dux/dl, uy=duy/dl;
        const proj=dx*ux+dy*uy;
        const o=rulerDrag.mode==='lineA'?rulerDrag.origA:rulerDrag.origB;
        const n={gx:clampAxis(Math.round(o.gx+ux*proj),GRID_W), gy:clampAxis(Math.round(o.gy+uy*proj),GRID_H)};
        if(rulerDrag.mode==='lineA') r.a=n; else r.b=n;
      }else{
        const o=rulerDrag.end==='a'?rulerDrag.origA:rulerDrag.origB;
        const n={gx:clampAxis(Math.round(o.gx+dx),GRID_W), gy:clampAxis(Math.round(o.gy+dy),GRID_H)};
        if(rulerDrag.end==='a') r.a=n; else r.b=n;
      }
      render();
      return;
    }
    if(symDragging){
      const g=evToGridF(e);

    if(symmetry==='v'||symmetry==='vh'){

    }
    if(symmetry==='h'||symmetry==='vh'){
      const n=my-y-1; if(n>=0&&n<GRID_H) cs.push([x,n]);
    }
    if(symmetry==='vh'){
      const m=mx-x-1, n=my-y-1;
      if(m>=0&&m<GRID_W&&n>=0&&n<GRID_H) cs.push([m,n]);
    }

    if(symmetry==='d45'||symmetry==='dx'){
      const m=y+(GRID_W-GRID_H)/2, n=x+(GRID_H-GRID_W)/2;
      if(m>=0&&m<GRID_W&&n>=0&&n<GRID_H) cs.push([m,n]);
    }
    if(symmetry==='d135'||symmetry==='dx'){
      const m=(GRID_W+GRID_H)/2-y-1, n=(GRID_W+GRID_H)/2-x-1;
      if(m>=0&&m<GRID_W&&n>=0&&n<GRID_H) cs.push([m,n]);

    if(symmetry==='dx'){

      const k=Math.min(gw/sw, gh/sh);

      dh=Math.max(1,Math.round(sh*k));

    let dw=sw, dh=sh;
    if(sw>gw||sh>gh){
      const k=Math.min(gw/sw, gh/sh);
      dw=Math.max(1,Math.round(sw*k));
      dh=Math.max(1,Math.round(sh*k));
    }
    const ox=Math.floor((gw-dw)/2), oy=Math.floor((gh-dh)/2);
    for(let y=0;y<dh;y++){
      const sy=Math.min(sh-1,Math.floor(y*sh/dh));
      for(let x=0;x<dw;x++){
        const sx=Math.min(sw-1,Math.floor(x*sw/dw));
        const si=(sy*sw+sx)*4;
        const a=px[si+3]/255;
        const r=Math.round(px[si]*a+255*(1-a));
        const g=Math.round(px[si+1]*a+255*(1-a));
        const b=Math.round(px[si+2]*a+255*(1-a));
        if(r===255&&g===255&&b===255) continue;
        const di=((oy+y)*gw+(ox+x))*4;
        out[di]=r;out[di+1]=g;out[di+2]=b;out[di+3]=255;
      }
    }
    return out;
  }
  function rasterizeRawToGrid(){
    const d=rasterizeRaw(origImg.px,origImg.w,origImg.h,GRID_W,GRID_H);
    if(d) pixels.set(d);
  }
  async function importImage(file){
    try{
      const img=await loadImage(file);
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h) throw new Error('无法读取图片尺寸');
      let scaled=false;
      if(w>GRID_W||h>GRID_H){
        const k=Math.min(GRID_W/w, GRID_H/h);
        w=Math.max(1,Math.round(w*k));
        h=Math.max(1,Math.round(h*k));
        scaled=true;
      }
      importedImg=img;
      // 捕获原图原始像素并生成持久化用 PNG：缩放/匹配据此按原图重新栅格化
      restoreImgToken++;   // 丢弃在途的草稿原图加载
      const oi=readImageRaw(img);
      origImg=oi||null;
      importedImgDataURL=null;
      if(oi){
        try{
          const tmp=document.createElement('canvas');
          tmp.width=oi.w; tmp.height=oi.h;
          tmp.getContext('2d').putImageData(new ImageData(oi.px,oi.w,oi.h),0,0);
          importedImgDataURL=tmp.toDataURL('image/png');
        }catch(e){ importedImgDataURL=null; }
      }
      // 先采快照（含旧色卡与旧编号），再清空匹配状态，保证撤回能还原旧编号
      const before=snapshot();
      matchedPalette=null;
      matchedCard=null;
      cellCodeIdx.fill(NO_CODE);
      showCodes=false;
      updateCodeBtn();
      fillWhite();
      const ox=Math.floor((GRID_W-w)/2);
      const oy=Math.floor((GRID_H-h)/2);
      rasterizeImageToGrid(img);
      lastImported={data:snapshot(),w:GRID_W,h:GRID_H};
      pushUndo(before);
      // 导入替换整幅画布：视为新画布，清除手动绘制标记（导入不算手动绘制）
      userEdited=false;
      render();
      statusEl.textContent='已导入 '+w+'×'+h+' 图片，居中于 ('+ox+','+oy+')'+(scaled?'（原图过大，已等比缩放）':'');
    }catch(err){

  }
  const matchBtn=document.getElementById('matchBtn');

  // Image 元素无法序列化，载回草稿后靠它们按原图重新栅格化，避免从已量化快照缩放失真
  let origImg=null;

  let restoreImgToken=0;

  // 锁定态 = userEdited && 画布非空白（撤销回空白自动解锁）
  let userEdited=false;
  function matchGrid(brand){
    const palette=buildMatchPalette(brand);
    const card=cardById(brand);
    if(!palette||!card){
      alert('未找到色卡数据');
      return;
    }
    // 先采快照（含当前色卡与编号），再清号/换卡，保证撤回能完整还原旧编号与旧色卡
    const before=snapshot();
    matchedPalette=palette;
    matchedCard=card;
    cellCodeIdx.fill(NO_CODE);
    // 以导入的原图为匹配源，避免小色卡量化后再匹配大色卡时信息已丢失而失真；
    // 刷新后无 Image 元素，回退到保存的导入原图快照。
    // 只对「原图有颜色 ∩ 画布当前该格也有颜色」的交集做匹配；空色块（画布为白）保持空白，
    // 这样切换子集时，被擦除/清空的格不会用原图重新补色回来。
    const src=(importedImg&&(importedImg.naturalWidth||importedImg.width)?rasterizeImage(importedImg,GRID_W,GRID_H):
               (lastImported&&lastImported.w===GRID_W&&lastImported.h===GRID_H?lastImported.data.pixels:pixels));
    let changed=0;
    for(let y=0;y<GRID_H;y++){
      for(let x=0;x<GRID_W;x++){
        const si=(y*GRID_W+x)*4;
        const cr=src[si], cg=src[si+1], cb=src[si+2];
        if(src[si+3]===0) continue;   // 原图该格为空（无色）
        const pi=(y*GRID_W+x)*4;
        if(pixels[pi+3]===0) continue;  // 画布该格当前为空（无色），保持空白
        const m=nearestCardColor(palette,cr,cg,cb);
        if(m.r!==cr||m.g!==cg||m.b!==cb) changed++;
        setCell(x,y,m.r,m.g,m.b);
        cellCodeIdx[y*GRID_W+x]=m._idx;
      }
    }
    pushUndo(before);
    render();
    refreshMatchActive();
    updateCodeBtn();
    statusEl.textContent='已匹配至 '+card.name+'（编号标注已解锁）· 匹配模式：后续绘制颜色将自动吸附该子集';
    updateExportStats();   // 色号数据变化后刷新导出预计尺寸（含清单大小）
  }
  function renderMatchPopup(){
    let html='';

  // 拖放导入：把「导入图片」按钮作为拖放落点，拖入图片时按钮高亮提示

  // ---- 导出 PNG ----
  // 导出与画布视图一致：方格辅助线 / 色卡标注编号 / 标尺 均按当前设置绘制，不额外询问
  // 支持全画幅导出，或框选矩形局部画幅导出大图
  const MAX_EXPORT=8192;   // 导出每边分辨率上限（越大编号越清晰，但文件/内存越大）
  const MIN_CELL=16;       // 全画幅导出最小格子尺寸：大画幅在默认视图也能看到编号（分辨率随画幅增大而增大）
  const LEGEND_RATIO=0.03; // 清单色块边长占导出图片宽度的比例（与格子大小无关，清单始终醒目）
  const LEGEND_MAX_W=2048; // 清单画布最大宽度：超过则按比例降低分辨率（清单只占画幅固定比例，无需过高清晰度），拼接/下载时再放大
  function exportRegion(gx0,gy0,gx1,gy1, big){
    const rw=gx1-gx0+1, rh=gy1-gy0+1;
    const gs=gridSize();
    const viewCell=gs.w/GRID_W;
    const cap=MAX_EXPORT/Math.max(rw,rh);
    // 整体导出：分辨率随画幅增大而增大（格子不小于 MIN_CELL，保证编号可见），但不超过每边上限；
    // 局部导出：取当前视图格子大小与大图分辨率中的较大者
    const cell=big ? Math.max(viewCell, cap) : Math.min(Math.max(viewCell, MIN_CELL), cap);
    const W=Math.round(rw*cell), H=Math.round(rh*cell);
    let out=document.createElement('canvas');
    out.width=W; out.height=H;
    const octx=out.getContext('2d');
    octx.imageSmoothingEnabled=false;
    // 空色块(alpha=0) 导出：默认合成到白底；「绿色」合成为绿色底；选「透明」则保留透明
    if(exportEmptyMode==='white'||exportEmptyMode==='green'){
      octx.fillStyle=exportEmptyMode==='green' ? '#00ff00' : '#fff';
      octx.fillRect(0,0,W,H);
    }
    octx.drawImage(gridCanvas, gx0,gy0, rw,rh, 0,0, W,H);
    if(showGrid){
      octx.strokeStyle='#000';
      octx.lineWidth=1;
      octx.beginPath();
      if(exportEmptyMode==='transparent'){
        // 透明导出：只保留色块相关的辅助线，透明(空)区域内部的框线去掉；
        // 每条线段仅当相邻格至少有一个有色(alpha=255)时才画，透明与色块交界处保留。
        for(let i=gx0;i<=gx1+1;i++){
          const px=(i-gx0)*cell;
          const hasLeft=i>gx0, hasRight=i<=gx1;
          for(let j=gy0;j<=gy1;j++){
            const aL=hasLeft ? pixels[(j*GRID_W+(i-1))*4+3] : 0;
            const aR=hasRight ? pixels[(j*GRID_W+i)*4+3] : 0;
            if(aL===255||aR===255){
              const py=(j-gy0)*cell;
              octx.moveTo(px,py); octx.lineTo(px,py+cell);
            }
          }
        }
        for(let j=gy0;j<=gy1+1;j++){
          const py=(j-gy0)*cell;
          const hasTop=j>gy0, hasBottom=j<=gy1;
          for(let i=gx0;i<=gx1;i++){
            const aT=hasTop ? pixels[((j-1)*GRID_W+i)*4+3] : 0;
            const aB=hasBottom ? pixels[(j*GRID_W+i)*4+3] : 0;
            if(aT===255||aB===255){
              const px=(i-gx0)*cell;
              octx.moveTo(px,py); octx.lineTo(px+cell,py);
            }
          }
        }

        for(let i=gx0;i<=gx1+1;i++){

        for(let j=gy0;j<=gy1+1;j++){

          octx.moveTo(0,p); octx.lineTo(W,p);
