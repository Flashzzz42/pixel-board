[package]
name = "pixel-board"
version = "1.3.2"
description = "拼豆像素画板"
authors = ["liusuyan"]
edition = "2021"

# Tauri 移动端要求 app 的 Rust 代码是库（iOS 编成静态库链接进 Swift app），
# main.rs 只作桌面入口薄壳调用 run()。
[lib]
name = "pixel_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 无 mobile feature：iOS/Android 按编译目标自动启用（tauri ios init 生成原生工程）
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 导出 PNG 时弹原生保存对话框 + WebView2 下载事件处理（Windows 专属，macOS/iOS 不编译）
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
webview2-com = "0.38"
windows = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
