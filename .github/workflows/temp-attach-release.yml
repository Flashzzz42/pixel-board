name: Temp attach mac DMGs

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          run-id: 31075515596
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMGs to Release v1.0.0
        run: |
          set -e
          echo "=== downloaded tree ==="
          find . -maxdepth 3 | sort
          find . \( -name "*.dmg" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            echo ">> uploading $f"
            gh release upload v1.0.0 "$f" --clobber -R "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
