name: Temp attach mac DMGs

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          run-id: 31075515596
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and upload mac installers to Release v1.0.0
        run: |
          set -e
          echo "=== downloaded tree ==="
          find . -maxdepth 3 | sort
          work=$(mktemp -d)
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            ext="${base##*.}"
            if [[ "$base" == *arm64* ]]; then
              out="pixel-board-1.0.0-mac-arm64.$ext"
            else
              out="pixel-board-1.0.0-mac-x64.$ext"
            fi
            cp "$f" "$work/$out"
            echo ">> uploading $out"
            gh release upload v1.0.0 "$work/$out" --clobber -R "${{ github.repository }}"
          done < <(find . \( -name "*.dmg" -o -name "*.zip" \) -print0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
