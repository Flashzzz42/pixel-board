name: Temp attach mac DMGs

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          run-id: 31075515596
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMGs to Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            mac-dmg/*.dmg
            mac-dmg/*.zip
