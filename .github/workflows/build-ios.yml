name: Build iOS

# 未签名 ipa：无 Apple secrets，构建后用户用 AltStore / Sideloadly（Windows 可装）侧载，
# 用自己的免费 Apple ID 签名并每 7 天自动续签。仅 workflow_dispatch 手动触发（试水阶段）。
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 生成 iOS Xcode 工程（gen/apple/ 不入库，每次构建重新生成）。
      - name: Init iOS project
        run: npm run tauri ios init

      # 关闭代码签名，产出未签名构建。关键：Tauri 生成的 pbxproj 不含 CODE_SIGNING_ALLOWED
      # 行（隐式默认签名），此前按「替换既有键」的方式因此落空。这里在每个 buildSettings
      # 字典开头直接插入 NO，并打印命中次数以便日志核对。xcodebuild 不读环境变量构建设置，
      # 所以必须改 pbxproj。无签名时 ipa 导出可能报退出码 70，但 .app 已生成，由下一步手动打包。
      - name: Disable code signing
        run: |
          PBX="$(find src-tauri/gen/apple -name project.pbxproj | head -1)"
          echo "PBX=$PBX"
          [ -n "$PBX" ] || { echo "::error::project.pbxproj not found"; exit 1; }
          perl -0777 -i -pe 's/buildSettings\s*=\s*\{/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          COUNT="$(grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBX")"
          echo "injected CODE_SIGNING_ALLOWED=NO in $COUNT buildSettings blocks"
          [ "$COUNT" -gt 0 ] || { echo "::error::pbxproj injection failed (no buildSettings matched)"; exit 1; }

      - name: Build iOS app (device)
        # --target 用 CLI 短名：aarch64=真机 / aarch64-sim=Apple Silicon 模拟器 / x86_64=Intel 模拟器
        run: npm run tauri ios build -- --target aarch64
        continue-on-error: true

      - name: Package unsigned IPA
        run: |
          set -e
          IPA="$(find src-tauri/gen -name '*.ipa' 2>/dev/null | head -1)"
          if [ -n "$IPA" ]; then
            echo "CLI produced ipa: $IPA"
            cp "$IPA" pixel-board-ios.ipa
          else
            APP="$(find src-tauri/gen -type d -name '*.app' | head -1)"
            echo "Packaging from .app: $APP"
            [ -n "$APP" ] || { echo "::error::no .app or .ipa produced"; exit 1; }
            rm -rf Payload && mkdir -p Payload
            cp -R "$APP" Payload/
            zip -r -q pixel-board-ios.ipa Payload
          fi
          echo "IPA size: $(du -h pixel-board-ios.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: pixel-board-ios.ipa
          if-no-files-found: error
