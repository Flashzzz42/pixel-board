name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Tauri 2 macOS 打包：frontendDist 指向 ../ui（copy-ui.mjs 已把 index.html 桌面版拷进去）。
      # macos-latest 是 Apple Silicon，默认出 arm64；要同时支持 Intel 可加 --target universal-apple-darwin。
      # 无签名证书也能出包（Tauri 跳过签名），但 .dmg 首开需右键「打开」；正式分发要 Apple 签名+公证。
      - name: Build macOS app (app + dmg)
        run: npm run tauri:build -- --bundles app,dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
